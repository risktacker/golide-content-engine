<!doctype html>
<!-- Recipe player (2026-11-17): runs one recipe scene (style.js, written for a beat of the video) on the
     Futurepedia stage kit, unchanged, with three.js 0.187.0. The engine calls window.seek(t) per frame. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 500; src: url(fonts/space-grotesk-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url(fonts/space-grotesk-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 700; src: url(fonts/inter-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 700; src: url(fonts/ibm-plex-mono-latin-700-normal.woff2) format("woff2"); }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"./three/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
window.errors = [];
window.addEventListener('error', (e) => window.errors.push(String(e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.errors.push(String(e.reason && e.reason.stack || e.reason)));
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1920, H = +q.get('h') || 1080, N = +q.get('n') || 4;
const c = document.getElementById('c'); c.width = W; c.height = H;
// every word the scene writes on its overlay is recorded with its box on screen, so the engine can check that labels
// never touch each other or leave the frame (2026-11-17)
window.boxes = [];
const fill = CanvasRenderingContext2D.prototype.fillText;
CanvasRenderingContext2D.prototype.fillText = function (text, x, y, ...rest) {
  const cv = this.canvas;
  if (window.recording && cv.width === W && cv.height === H && cv.id !== 'c' && this.globalAlpha > 0.5 && String(text).trim()) {
    const m = this.measureText(text), t = this.getTransform();
    const left = x - (m.actualBoundingBoxLeft || 0), right = x + (m.actualBoundingBoxRight || m.width);
    const top = y - (m.actualBoundingBoxAscent || 0), bottom = y + (m.actualBoundingBoxDescent || 0);
    const p = (a, b) => [t.a * a + t.c * b + t.e, t.b * a + t.d * b + t.f];
    const [x0, y0] = p(left, top), [x1, y1] = p(right, bottom);
    window.boxes.push({ text: String(text), x0: Math.min(x0, x1), y0: Math.min(y0, y1), x1: Math.max(x0, x1), y1: Math.max(y0, y1) });
  }
  return fill.call(this, text, x, y, ...rest);
};
const load = (src) => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('cannot load ' + src)); document.head.append(s); });
try {
  await document.fonts.load('700 40px "Space Grotesk"'); await document.fonts.load('500 40px "Space Grotesk"');
  await document.fonts.load('500 40px "IBM Plex Mono"'); await document.fonts.load('500 40px "Inter"');
  await document.fonts.load('700 40px "Inter"');
  await load('stage.js');
  // words that live in the 3D scene (K.textPlane, e.g. Layer Stack's labels) are measured too: tagged here, and
  // after each frame their corners are projected to the screen (2026-11-17: no collision in anything)
  const plane = K.textPlane;
  K.textPlane = (text, o = {}) => {
    const m = plane(text, o);
    // where the letters sit inside the plane, from the kit's own sizes: pad on every side, line height 1.12 x the
    // font size, letters about 0.74 x the font size tall (caps and descenders)
    const px = +(/(\d+(?:\.\d+)?)px/.exec(o.font || '700 160px "Inter"') || [0, 160])[1];
    const pad = o.pad == null ? Math.ceil(px * 0.25) : o.pad, lh = (o.lineHeight || 1.12) * px;
    const lines = String(text).split('\n').length, hpx = lh * lines + pad * 2;
    const wpx = m.geometry.parameters.width / m.geometry.parameters.height * hpx;
    m.userData.words = String(text);
    m.userData.inset = [pad / wpx, (pad + (lh - 0.74 * px) / 2) / hpx];
    return m;
  };
  await load('style.js');
  const style = window.STYLES[window.STYLES.length - 1];
  if (!style) throw new Error('style.js did not register a style');
  window.S = await K.run(c, style, { samples: N, width: W, height: H });
  window.DURATION = window.S.duration;
  const shown = (o) => { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; };
  const corner = new THREE.Vector3();
  const planes = () => {
    const { scene, camera } = window.S;
    camera.updateMatrixWorld();
    scene.traverse((m) => {
      if (!m.isMesh || !m.userData.words || !shown(m) || (m.material.opacity ?? 1) < 0.5) return;
      m.updateMatrixWorld(); m.geometry.computeBoundingBox();
      const b = m.geometry.boundingBox, xs = [], ys = [];
      for (const x of [b.min.x, b.max.x]) for (const y of [b.min.y, b.max.y]) {
        corner.set(x, y, 0).applyMatrix4(m.matrixWorld).project(camera);
        xs.push((corner.x + 1) / 2 * W); ys.push((1 - corner.y) / 2 * H);
      }
      const [ix, iy] = m.userData.inset || [0, 0];     // trim the plane to its letters
      const padX = (Math.max(...xs) - Math.min(...xs)) * ix, padY = (Math.max(...ys) - Math.min(...ys)) * iy;
      window.boxes.push({ text: m.userData.words, x0: Math.min(...xs) + padX, y0: Math.min(...ys) + padY,
                          x1: Math.max(...xs) - padX, y1: Math.max(...ys) - padY });
    });
  };
  window.seek = (t) => { window.boxes = []; window.recording = true; try { window.S.seek(t); planes(); } finally { window.recording = false; } };
  window.ready = true;
} catch (e) { window.errors.push(String(e && e.stack || e)); window.ready = true; }
</script></body></html>
