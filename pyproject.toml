[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golide-content-engine"
version = "0.2.0"
description = "Independent YouTube Shorts and short-form video production engine"
requires-python = ">=3.11"

[project.optional-dependencies]
production = [
  "google-api-python-client>=2.179,<3",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "openai>=2,<3",
  "pyspellchecker>=0.8,<1",
]
test = []

[project.scripts]
golide = "golide_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golide_engine = ["storage/schema.sql"]

[tool.unittest]
start-directory = "tests"
