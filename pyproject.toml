[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "golide-content-engine"
version = "0.1.0"
description = "Independent YouTube Shorts and short-form video production engine"
requires-python = ">=3.11"

[project.scripts]
golide = "golide_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

