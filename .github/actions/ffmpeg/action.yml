name: ffmpeg (static build, cached)
description: >
  A static ffmpeg (BtbN FFmpeg-Builds, GPL: libx264, libass) on PATH in seconds. apt-get install ffmpeg took 7-14
  minutes per machine on 2026-11-23, paid again by every 3D Short render machine.
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@v4
      with:
        path: ~/ffmpeg-static
        key: ffmpeg-btbn-master-2026-11-23
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/ffmpeg-static && cd ~/ffmpeg-static
        curl -fsSL -o f.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
        tar -xf f.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe' && rm f.tar.xz
    - shell: bash
      run: |
        echo "$HOME/ffmpeg-static" >> "$GITHUB_PATH"
        "$HOME/ffmpeg-static/ffmpeg" -hide_banner -filters 2>/dev/null | grep -q " ass " || { echo "this ffmpeg has no libass (captions)"; exit 1; }
        "$HOME/ffmpeg-static/ffmpeg" -hide_banner -encoders 2>/dev/null | grep -q libx264 || { echo "this ffmpeg has no libx264"; exit 1; }
