name: Approved production scheduler

on:
  push:
    branches: ["main"]
    paths:
      - ".github/production-kick"
  schedule:
    # Long-form generation: Tuesday/Saturday 06:00 Africa/Lusaka.
    - cron: "0 4 * * 2,6"
    # Short generation: Sunday/Monday/Wednesday/Friday 09:00 Africa/Lusaka.
    - cron: "0 7 * * 0,1,3,5"
    # Lightweight automatic resume windows for jobs waiting on owner voice.
    # 14:00 and 20:00 Africa/Lusaka.
    - cron: "0 12,18 * * *"
  workflow_dispatch:

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      # Owner recordings and rendered media live in temporary R2 storage.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check Studio automation control
        id: automation
        shell: bash
        run: |
          set -u
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=golide-studio-engine" || true)"
          TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          if [ -z "$TOKEN" ]; then
            echo "::warning::GitHub OIDC token unavailable; Studio automation gate failing closed."
            exit 0
          fi
          HTTP_CODE="$(curl --silent --show-error -o gate.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://studio.golidee.com/api/engine/automation/status" || echo 000)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Studio automation gate returned HTTP $HTTP_CODE; failing closed."
            head -c 300 gate.json 2>/dev/null || true
            exit 0
          fi
          ENABLED="$(jq -r '.enabled // false' gate.json)"
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Studio automation is RUNNING."
          else
            echo "::notice::Studio automation is PAUSED (Start automation not switched on); no paid work will run."
          fi
      - uses: actions/checkout@v4
        if: steps.automation.outputs.enabled == 'true'
      - name: Restore resumable media checkpoint
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        if: steps.automation.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg, fonts and Cairo (vector renderer)
        if: steps.automation.outputs.enabled == 'true'
        run: |
          if command -v ffmpeg >/dev/null && fc-match DejaVuSans >/dev/null && pkg-config --exists cairo; then
            ffmpeg -version | head -1
            pkg-config --modversion cairo
          else
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -exec mv {} {}.disabled \;
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2-dev pkg-config
          fi
      - run: python -m pip install -e '.[production,video]'
        if: steps.automation.outputs.enabled == 'true'
      - name: Produce, upload privately, then schedule
        if: steps.automation.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"
          GOLIDE_OPENAI_MONTHLY_CAP_USD: "7.00"
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
          GOLIDE_FAILURE_WEBHOOK: ${{ secrets.GOLIDE_FAILURE_WEBHOOK }}
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
        run: |
          set -o pipefail
          if ! golide automation-run 2>&1 | tee engine-output.txt; then
            tail -c 1500 engine-output.txt | tr '\n' ' ' | sed 's/%/%25/g' > engine-error.txt
            echo "::error title=golide automation-run failed::$(cat engine-error.txt)"
            exit 1
          fi
      - name: Save resumable media checkpoint
        id: checkpoint_save
        if: steps.automation.outputs.enabled == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove superseded production checkpoints
        if: steps.automation.outputs.enabled == 'true' && always() && steps.checkpoint_save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key] | @tsv' | \
          while IFS=$'\t' read -r id key; do
            case "$key" in
              golide-production-checkpoint-*)
                if [ "$key" != "$CURRENT_CACHE_KEY" ]; then
                  echo "Deleting superseded checkpoint: $key"
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
                fi
                ;;
            esac
          done
      - name: Save state and completed queue item
        if: steps.automation.outputs.enabled == 'true' && always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data production-queue
          git diff --cached --quiet || git commit -m "ops: record automated production"
          git push
      - name: Open one failure issue
        if: steps.automation.outputs.enabled == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'GOLIDE production automation failed';
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            }
