name: Approved production scheduler

on:
  push:
    branches: ["main"]
    paths:
      - ".github/production-kick"
  schedule:
    # Long-form generation: Tuesday/Thursday/Saturday 06:00 Africa/Lusaka.
    - cron: "0 4 * * 2,4,6"
    # Short generation: Sunday/Monday/Wednesday/Friday 09:00 Africa/Lusaka.
    - cron: "0 7 * * 1,3,5"
    # 13:00 Africa/Lusaka: releases due social posts (a short's Reels) on time, and a Short with no link by then
    # is made by the engine. (2026-11-14 owner: the 14:00 and 20:00 retry runs are removed; Studio starts a run
    # itself when he uploads, taps AI voice or pastes a link.)
    - cron: "0 11 * * *"
    # 2026-11-14 (owner): 19:30 Africa/Lusaka on long-video days: no link pasted by then, the engine takes over.
    - cron: "30 17 * * 2,4,6"
    # 2026-11-17 (owner): 00:05 Africa/Lusaka on slot days (Mon-Sat): the day's link card appears in Studio
    - cron: "5 22 * * 0-5"
  workflow_dispatch:

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      # Owner recordings and rendered media live in temporary R2 storage.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check Studio automation control
        id: automation
        shell: bash
        run: |
          set -u
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=golide-studio-engine" || true)"
          TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          if [ -z "$TOKEN" ]; then
            echo "::warning::GitHub OIDC token unavailable; Studio automation gate failing closed."
            exit 0
          fi
          HTTP_CODE="$(curl --silent --show-error -o gate.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://studio.golidee.com/api/engine/automation/status" || echo 000)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Studio automation gate returned HTTP $HTTP_CODE; failing closed."
            head -c 300 gate.json 2>/dev/null || true
            exit 0
          fi
          ENABLED="$(jq -r '.enabled // false' gate.json)"
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Studio automation is RUNNING."
          else
            echo "::notice::Studio automation is PAUSED (Start automation not switched on); no paid work will run."
          fi
      - uses: actions/checkout@v4
        if: steps.automation.outputs.enabled == 'true'
      - name: Start from the latest saved state (a run queued behind another must see its results)
        if: steps.automation.outputs.enabled == 'true'
        run: git pull --ff-only origin "${GITHUB_REF_NAME:-main}" || true
      - name: Restore resumable media checkpoint
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        if: steps.automation.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Keep the system packages (Ubuntu mirrors went down 2026-11-11 and held the Short)
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          # v2 (2026-11-18): saved with libEGL/libGL and the browser's own packages (v1 predated them)
          key: apt-debs-v2
      - name: Ensure FFmpeg, fonts and Cairo (vector renderer)
        if: steps.automation.outputs.enabled == 'true'
        run: |
          from_cache() {
            ls ~/apt-debs/*.deb >/dev/null 2>&1 || return 1
            sudo dpkg -i --force-depends ~/apt-debs/*.deb >/dev/null 2>&1 || true
            command -v ffmpeg >/dev/null && pkg-config --exists cairo && ldconfig -p | grep -q libEGL.so.1
          }
          # 2026-11-17: skia (the Stickman engine) needs libEGL/libGL at import, even when drawing on the CPU
          have() { command -v ffmpeg && fc-match DejaVuSans && pkg-config --exists cairo && ldconfig -p | grep -q libEGL.so.1; } >/dev/null 2>&1
          # 2026-11-18 (owner: "queue was only taking seconds, why 20 minutes"): the kept packages first, in
          # seconds; Ubuntu's mirrors only when something is missing from them (a slow mirror held runs 11-15 min)
          if ! have && ls ~/apt-debs/*.deb >/dev/null 2>&1; then
            sudo dpkg -i --force-depends ~/apt-debs/*.deb >/dev/null 2>&1 || true
            sudo ldconfig
          fi
          if have; then
            ffmpeg -version | head -1
            pkg-config --modversion cairo
          else
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -exec mv {} {}.disabled \;
            # 2026-11-06: a hung mirror held this step 40 minutes; give up after 6 and retry once
            for attempt in 1 2; do
              if timeout 240 sudo apt-get update -o Acquire::Retries=2 \
                 && timeout 600 sudo apt-get install -y -o Acquire::Retries=3 ffmpeg fonts-dejavu-core libcairo2-dev pkg-config libegl1 libgl1; then
                mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
                break
              fi
              if from_cache; then echo "::warning title=Ubuntu mirrors::down, installed from the kept packages"; break; fi
              [ "$attempt" = 2 ] && exit 1
            done
          fi
      # 2026-11-19 (owner: "npm always installing"): the Python packages live in a venv kept between runs, rebuilt only
      # when pyproject.toml changes; a run with the venv only re-links the engine (seconds, not a minute of downloads)
      - name: Keep the Python packages between runs
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.venv-golide
          key: pyvenv-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}
      - name: Python packages (from the kept venv when it is there)
        if: steps.automation.outputs.enabled == 'true'
        run: |
          V="$HOME/.venv-golide"
          if [ -x "$V/bin/python" ] && "$V/bin/python" -c "import golide_engine, playwright, openai" 2>/dev/null; then
            "$V/bin/python" -m pip install -q --no-deps -e .
          else
            rm -rf "$V" && python -m venv "$V" && "$V/bin/python" -m pip install -q -e '.[production,video]'
          fi
          echo "$V/bin" >> "$GITHUB_PATH"
      - name: Keep the browser between runs
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
      - name: Browser for the thumbnail logo tiles
        if: steps.automation.outputs.enabled == 'true'
        # 2026-11-18: the browser is kept between runs and its system packages go into the kept packages; Ubuntu's
        # mirrors are asked only when the browser cannot start
        run: |
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright as p; x = p().start(); x.chromium.launch().close(); x.stop()" >/dev/null 2>&1; then
            timeout 600 python -m playwright install-deps chromium
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          fi
      - name: Keep the edit engine tools between runs
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golide-rhubarb
            ~/.npm
          key: edit-tools-v2-hyperframes-0.9.32-rhubarb-1.14.0
      - name: Edit engine tools (Rhubarb Lip Sync, HyperFrames)
        if: steps.automation.outputs.enabled == 'true'
        run: |
          R="$HOME/.cache/golide-rhubarb"
          if [ ! -x "$R/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb" ]; then
            mkdir -p "$R" && curl -sSL -o "$R/r.zip" https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip \
              && unzip -qo "$R/r.zip" -d "$R" && rm "$R/r.zip" || echo "::warning title=Rhubarb::download failed, mouth follows loudness"
          fi
          npx -y hyperframes@0.9.32 --version || true
      - name: Keep built 3D objects between runs (an object is paid for once)
        if: steps.automation.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/golide-cad3d
          key: cad3d-${{ github.run_id }}
          restore-keys: cad3d-
      - name: Produce, upload privately, then schedule
        if: steps.automation.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
          GOLIDE_FAILURE_WEBHOOK: ${{ secrets.GOLIDE_FAILURE_WEBHOOK }}
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -o pipefail
          if ! golide automation-run 2>&1 | tee engine-output.txt; then
            tail -c 1500 engine-output.txt | tr '\n' ' ' | sed 's/%/%25/g' > engine-error.txt
            echo "::error title=golide automation-run failed::$(cat engine-error.txt)"
            exit 1
          fi
      - name: Publish due social posts (long videos to Facebook and LinkedIn)
        if: steps.automation.outputs.enabled == 'true' && always()
        continue-on-error: true
        env:
          GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
        run: golide studio-social-publish
      - name: Save resumable media checkpoint
        id: checkpoint_save
        if: steps.automation.outputs.enabled == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove superseded production checkpoints
        if: steps.automation.outputs.enabled == 'true' && always() && steps.checkpoint_save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key] | @tsv' | \
          while IFS=$'\t' read -r id key; do
            case "$key" in
              golide-production-checkpoint-*)
                if [ "$key" != "$CURRENT_CACHE_KEY" ]; then
                  echo "Deleting superseded checkpoint: $key"
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
                fi
                ;;
            esac
          done
      - name: Save state and completed queue item
        if: steps.automation.outputs.enabled == 'true' && always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data production-queue
          git diff --cached --quiet || git commit -m "ops: record automated production"
          # Another push may have landed meanwhile: rebase onto it and retry.
          for attempt in 1 2 3 4 5; do
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          done
      - name: Open one failure issue
        if: steps.automation.outputs.enabled == 'true' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'GOLIDE production automation failed';
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            }
