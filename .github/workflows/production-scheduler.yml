name: Approved production scheduler

on:
  push:
    branches: ["main"]
    paths:
      - ".github/production-kick"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write
  actions: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore resumable media checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg and GOLIDE fonts
        run: |
          if command -v ffmpeg >/dev/null && fc-match DejaVuSans >/dev/null; then
            ffmpeg -version | head -1
            fc-match DejaVuSans | head -1
          else
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -exec mv {} {}.disabled \;
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - run: python -m pip install -e '.[production]'
      - name: Produce, upload privately, then schedule
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_OPENAI_MONTHLY_CAP_USD: "7.00"
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
          GOLIDE_STUDIO_BYPASS_TOKEN: ${{ secrets.GOLIDE_STUDIO_BYPASS_TOKEN }}
          GOLIDE_FAILURE_WEBHOOK: ${{ secrets.GOLIDE_FAILURE_WEBHOOK }}
          GOLIDE_META_API_VERSION: ${{ secrets.GOLIDE_META_API_VERSION }}
          INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_USER_ACCESS_TOKEN }}
          GOLIDE_INSTAGRAM_USER_ID: ${{ secrets.GOLIDE_INSTAGRAM_USER_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          GOLIDE_FACEBOOK_PAGE_ID: ${{ secrets.GOLIDE_FACEBOOK_PAGE_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          GOLIDE_LINKEDIN_AUTHOR_URN: ${{ secrets.GOLIDE_LINKEDIN_AUTHOR_URN }}
          GOLIDE_LINKEDIN_VERSION: ${{ secrets.GOLIDE_LINKEDIN_VERSION }}
          X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
        run: |
          golide connections-sync-studio
          golide automation-run
      - name: Save resumable media checkpoint
        id: checkpoint_save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove superseded production checkpoints
        if: always() && steps.checkpoint_save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key] | @tsv' | \
          while IFS=$'\t' read -r id key; do
            case "$key" in
              golide-production-checkpoint-*)
                if [ "$key" != "$CURRENT_CACHE_KEY" ]; then
                  echo "Deleting superseded checkpoint: $key"
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
                fi
                ;;
            esac
          done
      - name: Save state and completed queue item
        if: always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data production-queue
          git diff --cached --quiet || git commit -m "ops: record automated production"
          git push
      - name: Open one failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'GOLIDE production automation failed';
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            }
