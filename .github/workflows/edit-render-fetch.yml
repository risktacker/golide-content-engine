name: Edit render fetch (debug a filming job)
# Copies a split-render job's composition from R2 to the branch debug/<job> so it can be filmed and timed elsewhere.
on:
  workflow_dispatch:
    inputs:
      job: { description: "render job (editrender/<job>/ in R2)", required: true }
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e "$GITHUB_WORKSPACE"
      - run: |
          mkdir -p /tmp/out && cd /tmp/out
          python3 -c "
          from golide_engine.edit import remote
          open('bundle.tgz','wb').write(remote.get('$JOB','bundle.tgz')); open('meta.json','wb').write(remote.get('$JOB','meta.json'))"
          split -b 45m bundle.tgz bundle.tgz.part-
          rm bundle.tgz
          git init -q && git checkout -q -b "debug/$JOB"
          git config user.name golide-production-bot && git config user.email actions@users.noreply.github.com
          git add . && git commit -qm "debug: composition of $JOB"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "debug/$JOB"
