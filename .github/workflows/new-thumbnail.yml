name: New thumbnail (options, then upload the one picked)

# 2026-11-20 (owner: the long videos with the real thing glowing on black got hundreds of views, the Goli-and-two-
# web-pages ones a handful): make options in that look for a published video (about $0.05 each), push them to the
# review-results branch to look at; run again with `upload` = the option number to set it on YouTube.
on:
  workflow_dispatch:
    inputs:
      production_id: {description: "e.g. golide-long-2026-11-19", required: true}
      video_id: {description: "YouTube video id", required: true}
      title: {description: "The video title", required: true}
      count: {description: "How many options", default: "2"}
      upload: {description: "Empty = make options; a number = upload that option from review-results", default: ""}
      goli_words: {description: "Words for a Goli design with real photos of the story's things (empty = skip it)", default: ""}
      goli_punch: {description: "Accent word of those words", default: ""}
      things: {description: "Wikipedia pages whose photos go on the Goli design, comma-separated", default: ""}

permissions:
  contents: write
  id-token: write

jobs:
  thumb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: productions
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: golide-production-checkpoint-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config >/dev/null
      - run: python -m pip install -q -e '.[production,video]' && python -m playwright install --with-deps chromium >/dev/null
      - name: Make options
        if: inputs.upload == ''
        env:
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "${{ inputs.count }}" != "0" ]; then
            python tools/thumb_options.py "${{ inputs.production_id }}" "${{ inputs.title }}" "${{ inputs.count }}" || true
          fi
          mkdir -p out && cp production-queue/preview/thumb-options/${{ inputs.production_id }}-option-*.png out/ 2>/dev/null || true
          git fetch -q origin thumb-options 2>/dev/null && for f in $(git ls-tree --name-only origin/thumb-options); do
            [ -e "out/$f" ] || git show "origin/thumb-options:$f" > "out/$f"; done || true
          if [ -n "${{ inputs.goli_words }}" ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          from golide_engine.engine.source_capture import subject_pictures
          from golide_engine.vector.thumb_engine import make
          from golide_engine.providers.registry import ProviderRegistry
          things = [t.strip() for t in "${{ inputs.things }}".split(",") if t.strip()]
          got = subject_pictures(things, Path("goli-pics"), 1)
          pics = [Path("goli-pics") / p for g in got for p in (g.get("photos") or ([g["photo"]] if g.get("photo") else []))]
          pics = [p for p in pics if p.exists()]
          print(json.dumps({"photos": [p.name for p in pics], "fetched": [{k: g.get(k) for k in ("subject", "ok", "error")} for g in got]}))
          n = len([f for f in os.listdir("out") if f.endswith(".png")]) + 1
          out = Path("out") / f"${{ inputs.production_id }}-option-{n}.png"
          text = ProviderRegistry(Path("config/providers.json")).text(live=True)
          style = make("${{ inputs.title }}", "${{ inputs.goli_words }}", "${{ inputs.goli_punch }}", [], out,
                       shots=pics, photo=pics[0] if pics else None, text=text, seed=1, log=lambda e: print(json.dumps(e)))
          print(json.dumps({"goli_design": style, "file": out.name}))
          PY
          fi
          ls out
          cd out && git init -q && git checkout -q -b thumb-options && git add -A
          git -c user.name=golide-bot -c user.email=bot@golidee.com commit -qm "thumbnail options ${{ inputs.production_id }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" thumb-options
      - name: Upload the picked option
        if: inputs.upload != ''
        env:
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
          PID: ${{ inputs.production_id }}
          VID: ${{ inputs.video_id }}
          PICK: ${{ inputs.upload }}
        run: |
          git fetch -q origin thumb-options && git show "origin/thumb-options:${PID}-option-${PICK}.png" > picked.png
          python - <<'PY'
          import os
          from PIL import Image
          from golide_engine.youtube.auth import services
          from googleapiclient.http import MediaFileUpload
          Image.open("picked.png").convert("RGB").save("picked.jpg", quality=92)
          youtube, _ = services()
          youtube.thumbnails().set(videoId=os.environ["VID"], media_body=MediaFileUpload("picked.jpg", mimetype="image/jpeg")).execute()
          print("thumbnail set on", os.environ["VID"])
          PY
