name: Product picture probe
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What real product to draw"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[production]' || python -m pip install -q -e .
      - name: Draw one product picture
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python tools/product_probe.py ${{ inputs.prompt }}
      - name: Save it
        run: |
          git config user.name "golide-production-bot"
          git config user.email "golide-production-bot@users.noreply.github.com"
          git add -f production-queue/preview/
          git commit -m "ops: product picture probe" || exit 0
          git pull --rebase && git push
