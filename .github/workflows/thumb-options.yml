name: Thumbnail options

# 2026-11-05: replacement thumbnails for a published video, emailed to the owner.
on:
  workflow_dispatch:
    inputs:
      production_id: {description: "e.g. golide-long-2026-11-03", required: true}
      title: {description: "The video title", required: true}
      count: {description: "How many", required: false, default: "2"}

permissions:
  contents: write

jobs:
  options:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            productions
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config >/dev/null
      - run: python -m pip install -q -e '.[production,video]'
      - name: Make and email
        env:
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python tools/thumb_options.py "${{ inputs.production_id }}" "${{ inputs.title }}" "${{ inputs.count }}"
      - name: Keep a copy
        if: always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "golide-production-bot@users.noreply.github.com"
          git fetch -q origin probe-output && git checkout -q -B probe-output origin/probe-output || git checkout -q -b probe-output
          git add -f production-queue/preview/thumb-options/*option* || exit 0
          git commit -qm "ops: thumbnail options ${{ inputs.production_id }}" || exit 0
          git push -q origin probe-output
