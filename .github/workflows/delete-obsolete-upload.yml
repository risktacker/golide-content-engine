name: Remove obsolete five-second upload

on:
  workflow_run:
    workflows: ["One-time corrected long-video publication"]
    types: [completed]

permissions:
  contents: read

jobs:
  delete-obsolete:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
      - name: Delete obsolete five-second upload
        env:
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
        run: |
          python - <<'PY'
          from golide_engine.youtube.auth import assert_channel, credentials, services
          youtube, _ = services(credentials())
          assert_channel(youtube, "UCqaXVBSBz7iQsRHOupKt-3w")
          youtube.videos().delete(id="P7on5HfmI4Q").execute()
          print("Deleted obsolete upload P7on5HfmI4Q")
          PY
