name: Cached flagship finalize recovery

on:
  push:
    branches: ["main"]
    paths:
      - ".github/flagship-finalize-recovery-kick"

concurrency:
  group: golide-state-writer
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  finalize-cached-flagship:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRODUCTION_ID: golide-long-flagship-2026-09-03
      ORIGINAL_YOUTUBE_VIDEO_ID: e5LVF8QZ2VA
      YOUTUBE_CHANNEL_ID: UCqaXVBSBz7iQsRHOupKt-3w
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore flagship checkpoint media only
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-flagship-2026-09-03-finalize-${{ github.run_id }}
          restore-keys: |
            golide-production-correction-flagship-2026-09-03-finalize-
            golide-production-checkpoint-33798206892-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install finalize dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e '.[production]'

      - name: Verify cached inputs before final assembly
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          package = Path('release-packages') / pid
          manifest = json.loads((work / 'render-manifest.json').read_text(encoding='utf-8'))
          scenes = manifest.get('scenes', [])
          if len(scenes) != 108:
              raise SystemExit(f'expected 108 cached scenes, found {len(scenes)}')

          valid = 0
          scene_dir = Path('build') / pid / 'scenes'
          for index, scene in enumerate(scenes):
              clip = scene_dir / f'{index:03d}.mp4'
              if not clip.is_file() or clip.stat().st_size == 0:
                  continue
              probe = subprocess.run(
                  ['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(clip)],
                  capture_output=True, text=True
              )
              if probe.returncode == 0:
                  try:
                      actual = float(probe.stdout.strip())
                      if abs(actual - float(scene['duration'])) <= 0.20:
                          valid += 1
                  except ValueError:
                      pass
          print(f'CACHED_SCENE_CLIPS_VALID={valid}/108')
          if valid != 108:
              raise SystemExit('cached scene set is incomplete; refusing any new media generation')

          if not (package / 'package-manifest.json').is_file():
              raise SystemExit('cached release package manifest missing')
          print('FINALIZE_PREFLIGHT=passed')
          PY

      - name: Assemble corrected video from cached scene clips
        run: |
          set -euo pipefail
          rm -f "build/${PRODUCTION_ID}/silent.mp4" "build/${PRODUCTION_ID}/video.mp4" "build/${PRODUCTION_ID}/metadata.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from golide_engine.manifest import load_project
          from golide_engine.render import render

          root = Path('.').resolve()
          pid = os.environ['PRODUCTION_ID']
          manifest_path = root / 'productions' / pid / 'render-manifest.json'
          output = render(load_project(manifest_path), root)
          print(f'FINAL_ASSEMBLY={output}')
          PY

      - name: Frozen-tail and duration gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          build = Path('build') / pid
          manifest = json.loads((work / 'render-manifest.json').read_text(encoding='utf-8'))
          expected = sum(float(scene['duration']) for scene in manifest['scenes'])

          def duration(path: Path) -> float:
              result = subprocess.run([
                  'ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(path)
              ], capture_output=True, text=True, check=True)
              return float(result.stdout.strip())

          silent = build / 'silent.mp4'
          final = build / 'video.mp4'
          silent_seconds = duration(silent)
          final_seconds = duration(final)
          if abs(silent_seconds - expected) > 0.35 or abs(final_seconds - expected) > 0.35:
              raise SystemExit(f'BLOCKED: duration mismatch silent={silent_seconds:.3f} final={final_seconds:.3f} expected={expected:.3f}')

          sample_times = [20,45,75,105,135,165,195,225,255,280]
          signatures = []
          for second in sample_times:
              result = subprocess.run([
                  'ffmpeg','-v','error','-ss',str(second),'-i',str(final),
                  '-frames:v','1','-vf','scale=48:27,format=gray','-f','rawvideo','-'
              ], capture_output=True, check=True)
              signatures.append(hashlib.sha256(result.stdout).hexdigest()[:16])
          unique = len(set(signatures))
          tail_unique = len(set(signatures[-5:]))
          print(f'VISUAL_CADENCE_GATE=unique={unique}|tail_unique={tail_unique}|silent={silent_seconds:.3f}|final={final_seconds:.3f}')
          if unique < 7 or tail_unique < 4:
              raise SystemExit('BLOCKED: visual timeline still appears frozen/repetitive across the long-form edit')
          print('FROZEN_TAIL_GATE=passed')
          PY

      - name: Save passed video assembly checkpoint
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-flagship-2026-09-03-finalize-${{ github.run_id }}-assembled

      - name: Build corrected thumbnail directly from locked canonical avatar
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter, ImageOps
          from golide_engine.quality.visual import normalize_thumbnail

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          target = work / 'thumbnail-correction.jpg'
          source_png = work / 'thumbnail-correction-source.png'

          identity = json.loads(Path('config/visual-identity.json').read_text(encoding='utf-8'))
          avatar_cfg = identity['avatar']
          canonical_b64 = Path(avatar_cfg['canonical_reference_b64'])
          encoded = ''.join(canonical_b64.read_text(encoding='ascii').split())
          raw = base64.b64decode(encoded + ('=' * ((-len(encoded)) % 4)), validate=False)
          if not raw.startswith(b'\xff\xd8\xff'):
              raise SystemExit('locked canonical avatar source did not decode to JPEG')
          avatar = Image.open(io.BytesIO(raw)).convert('RGB')
          avatar.verify if False else None
          print('CANONICAL_AVATAR_SOURCE_SHA256=' + hashlib.sha256(raw).hexdigest())
          print(f'CANONICAL_AVATAR_SOURCE_SIZE={avatar.width}x{avatar.height}')

          manifest = json.loads((work / 'render-manifest.json').read_text(encoding='utf-8'))
          topic = None
          for scene in manifest['scenes']:
              candidate = Path(scene['media'])
              if not candidate.is_file() or candidate.suffix.lower() not in {'.jpg','.jpeg','.png','.webp'}:
                  continue
              try:
                  image = Image.open(candidate).convert('RGB')
              except Exception:
                  continue
              # Prefer a landscape or square topic frame with enough detail for a thumbnail.
              if image.width >= 512 and image.height >= 512:
                  topic = image
                  print(f'THUMBNAIL_TOPIC_SOURCE={candidate}')
                  break
          if topic is None:
              raise SystemExit('no cached topic visual available for deterministic thumbnail')

          W, H = 1280, 720
          navy = (15, 24, 48)
          gold = (212, 167, 73)
          blue = (25, 157, 255)
          ivory = (245, 240, 225)
          canvas = Image.new('RGB', (W, H), navy)

          # Topic side: crop-fill and soften behind a clean paper edge.
          topic_panel = ImageOps.fit(topic, (760, 720), method=Image.Resampling.LANCZOS, centering=(0.55, 0.5))
          topic_panel = topic_panel.filter(ImageFilter.UnsharpMask(radius=1.2, percent=120, threshold=3))
          canvas.paste(topic_panel, (520, 0))

          # Canonical avatar side: use the exact tracked portrait pixels, never a regenerated substitute.
          avatar_panel = ImageOps.fit(avatar, (520, 650), method=Image.Resampling.LANCZOS, centering=(0.5, 0.35))
          mask = Image.new('L', avatar_panel.size, 0)
          md = ImageDraw.Draw(mask)
          md.rounded_rectangle((8, 8, 512, 642), radius=54, fill=255)
          avatar_panel.putalpha(mask)
          canvas_rgba = canvas.convert('RGBA')
          shadow = Image.new('RGBA', (W, H), (0,0,0,0))
          sd = ImageDraw.Draw(shadow)
          sd.rounded_rectangle((24, 52, 536, 704), radius=58, fill=(0,0,0,90))
          shadow = shadow.filter(ImageFilter.GaussianBlur(18))
          canvas_rgba.alpha_composite(shadow)
          canvas_rgba.alpha_composite(avatar_panel, (8, 34))

          draw = ImageDraw.Draw(canvas_rgba)
          # Paper-cut separation and stabilization/gimbal cue; deliberately no text.
          draw.line((520, 0, 520, H), fill=ivory + (255,), width=10)
          draw.line((530, 0, 530, H), fill=gold + (255,), width=5)
          cx, cy = 1005, 365
          for radius, color, width in [(170, gold, 8), (112, blue, 6), (58, ivory, 5)]:
              draw.ellipse((cx-radius, cy-radius, cx+radius, cy+radius), outline=color + (230,), width=width)
          draw.line((cx-210, cy, cx+210, cy), fill=blue + (210,), width=4)
          draw.line((cx, cy-210, cx, cy+210), fill=gold + (210,), width=4)

          canvas_rgba.convert('RGB').save(source_png, quality=96)
          normalize_thumbnail(source_png, target)
          if target.stat().st_size > 2_000_000:
              raise SystemExit('corrected thumbnail exceeds 2 MB')
          print('CORRECTED_THUMBNAIL=ready|identity=exact-tracked-canonical-source|paid_generation=0')
          PY

      - name: Automatic QA on corrected video and thumbnail
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from golide_engine.quality.runner import QualityRunner

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          video = Path('build') / pid / 'video.mp4'
          thumbnail = work / 'thumbnail-correction.jpg'
          storyboard = json.loads((work / 'storyboard-authoritative-v5.json').read_text(encoding='utf-8'))
          metadata = json.loads((work / 'upload-metadata.json').read_text(encoding='utf-8'))
          script = (work / 'script.txt').read_text(encoding='utf-8').strip()
          report_path = work / 'qa-report-correction.json'
          report = QualityRunner('config/qa-policy.json').run(
              video, 'long', storyboard,
              [script, metadata['title'], metadata['description']],
              report_path, thumbnail,
          )
          if not report.passed:
              raise SystemExit('CORRECTION QA FAILED: ' + '; '.join(report.failures))
          print('CORRECTION_QA=passed')
          PY

      - name: Update release package with verified correction
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          pid = os.environ['PRODUCTION_ID']
          package = Path('release-packages') / pid
          work = Path('productions') / pid
          manifest_path = package / 'package-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest['files']

          video_src = Path('build') / pid / 'video.mp4'
          video_dst = package / files['video']['file']
          shutil.copy2(video_src, video_dst)
          thumb_dst = package / 'thumbnail-correction.jpg'
          shutil.copy2(work / 'thumbnail-correction.jpg', thumb_dst)
          files['thumbnail']['file'] = 'thumbnail-correction.jpg'
          qa_dst = package / files['qa_report']['file']
          shutil.copy2(work / 'qa-report-correction.json', qa_dst)

          for role in ('video','thumbnail','qa_report'):
              path = package / files[role]['file']
              files[role]['sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
              files[role]['bytes'] = path.stat().st_size

          manifest['release']['approved'] = True
          manifest['release']['qa'] = {'passed': True}
          manifest['release']['scheduled_at'] = None
          manifest['release']['force_reupload'] = True
          manifest['correction'] = {
              'reason': 'repair cached final edit and restore canonical avatar thumbnail',
              'original_youtube_video_id': os.environ['ORIGINAL_YOUTUBE_VIDEO_ID'],
              'upload_policy': 'private-corrected-preview',
              'scene_media_generation': 'reused-cached-108-clips-only',
              'thumbnail_identity': 'exact-tracked-canonical-avatar-source',
              'thumbnail_paid_generation': False,
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
          golide release-verify "release-packages/${PRODUCTION_ID}"

      - name: Save verified finalize package
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-flagship-2026-09-03-finalize-${{ github.run_id }}-verified

      - name: Upload corrected flagship as new private YouTube video
        env:
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_FORCE_REUPLOAD_PRODUCTION_ID: golide-long-flagship-2026-09-03
        run: |
          golide youtube-upload "release-packages/${PRODUCTION_ID}"

      - name: Record corrected private upload state
        if: success()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ops: record corrected flagship private preview"
          git pull --rebase origin main
          git push
