name: Distribution Rebuild CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q src/golide_engine/engine src/golide_engine/db src/golide_engine/jobs src/golide_engine/providers src/golide_engine/storage src/golide_engine/web tests
      - run: python -m unittest discover -s tests -p 'test_distribution*.py' -v
