name: Flagship production final

on:
  push:
    branches: [codex/final]
    paths: [.github/flagship-production-final-kick]
  workflow_dispatch:

concurrency:
  group: golide-flagship-final
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_ID: golide-long-flagship-2026-09-03
  CACHE_KEY: golide-production-correction-flagship-2026-09-03-33805778023-scene-fixed
  CACHE_FALLBACK: golide-production-checkpoint-33798206892-1
  CHANNEL_ID: UCqaXVBSBz7iQsRHOupKt-3w

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e '.[production]'
      - name: Restore validated assembled products
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_FALLBACK }}
          fail-on-cache-miss: true
      - name: Full no-spend preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from golide_engine.manifest import load_project,validate_assets
          from golide_engine.visual_identity import VisualIdentity
          from golide_engine.release.package import ReleasePackager
          pid=os.environ['SOURCE_ID']; w=Path('productions')/pid; b=Path('build')/pid; p=Path('release-packages')/pid
          required=[w/'render-manifest.json',w/'storyboard-authoritative-v5.json',w/'script.txt',w/'upload-metadata.json',p/'package-manifest.json']
          missing=[str(x) for x in required if not x.is_file()]
          if missing: raise SystemExit('MISSING='+repr(missing))
          m=json.loads((w/'render-manifest.json').read_text()); scenes=m['scenes']
          if len(scenes)!=108: raise SystemExit(f'SCENES={len(scenes)}')
          expected=sum(float(s['duration']) for s in scenes)
          if not 280<=expected<=290: raise SystemExit(f'EXPECTED_DURATION={expected}')
          errors=validate_assets(load_project(w/'render-manifest.json'))
          if errors: raise SystemExit('ASSETS='+repr(errors[:10]))
          valid=0
          for i,s in enumerate(scenes):
              f=b/'scenes'/f'{i:03d}.mp4'
              if not f.is_file(): continue
              r=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(f)],capture_output=True,text=True)
              try:
                  if r.returncode==0 and abs(float(r.stdout.strip())-float(s['duration']))<=.20: valid+=1
              except ValueError: pass
          if valid!=108: raise SystemExit(f'CACHE_SCENES={valid}/108')
          VisualIdentity('config/visual-identity.json').canonical_avatar_reference()
          pm=json.loads((p/'package-manifest.json').read_text())
          if pm.get('production_id')!=pid: raise SystemExit('SOURCE_PACKAGE_ID')
          if pm.get('release',{}).get('channel_id')!=os.environ['CHANNEL_ID']: raise SystemExit('SOURCE_CHANNEL')
          bad=ReleasePackager.verify(p)
          if bad: raise SystemExit('SOURCE_PACKAGE=' + repr(bad))
          print(f'PREFLIGHT_OK scenes=108 duration={expected:.3f}')
          PY
      - name: Create NEW production workspace
        id: prod
        shell: bash
        run: |
          set -euo pipefail
          id="golide-long-flagship-${GITHUB_RUN_ID}"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          cp -a "productions/${SOURCE_ID}" "productions/${id}"
          cp -a "build/${SOURCE_ID}" "build/${id}"
          cp -a "release-packages/${SOURCE_ID}" "release-packages/${id}"
          rm -f "build/${id}/silent.mp4" "build/${id}/video.mp4" "build/${id}/metadata.json"
          rm -f "productions/${id}/thumbnail.jpg" "productions/${id}/qa-report.json"
          rm -f "release-packages/${id}/"*.zip
          NEW_ID="$id" python - <<'PY'
          import json,os
          from pathlib import Path
          pid=os.environ['NEW_ID']
          m=Path('productions')/pid/'render-manifest.json'
          d=json.loads(m.read_text()); d['id']=pid; d['publish']={'approved':True}; m.write_text(json.dumps(d,indent=2)+'\n')
          pm=Path('release-packages')/pid/'package-manifest.json'
          d=json.loads(pm.read_text()); d['production_id']=pid; d['release']['approved']=False; d['release']['scheduled_at']=None; d['release'].pop('force_reupload',None); pm.write_text(json.dumps(d,indent=2)+'\n')
          PY
        env:
          NEW_ID: ${{ steps.prod.outputs.id }}
      - name: Verify new product uses 108 cached scene products
        env: {NEW_ID: '${{ steps.prod.outputs.id }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          pid=os.environ['NEW_ID']; w=Path('productions')/pid; b=Path('build')/pid; m=json.loads((w/'render-manifest.json').read_text()); n=0
          for i,s in enumerate(m['scenes']):
              f=b/'scenes'/f'{i:03d}.mp4'
              if f.is_file():
                  r=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(f)],capture_output=True,text=True)
                  try:
                      if r.returncode==0 and abs(float(r.stdout.strip())-float(s['duration']))<=.20: n+=1
                  except ValueError: pass
          if n!=108: raise SystemExit(f'REUSE={n}/108')
          print('REUSE=108/108')
          PY
      - name: Render NEW final product from cached scenes
        env: {NEW_ID: '${{ steps.prod.outputs.id }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from golide_engine.manifest import load_project
          from golide_engine.render import render
          pid=os.environ['NEW_ID']; print(render(load_project(Path('productions')/pid/'render-manifest.json'),Path('.').resolve()))
          PY
      - name: Validate video and frozen-tail gates
        env: {NEW_ID: '${{ steps.prod.outputs.id }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          pid=os.environ['NEW_ID']; w=Path('productions')/pid; b=Path('build')/pid; m=json.loads((w/'render-manifest.json').read_text()); expected=sum(float(x['duration']) for x in m['scenes'])
          def dur(p): return float(subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)],capture_output=True,text=True,check=True).stdout.strip())
          final=dur(b/'video.mp4'); silent=dur(b/'silent.mp4')
          if abs(final-expected)>.35 or abs(silent-expected)>.35: raise SystemExit(f'DURATION={final}/{silent}/{expected}')
          sig=[]
          for t in [20,45,75,105,135,165,195,225,255,280]:
              r=subprocess.run(['ffmpeg','-v','error','-ss',str(t),'-i',str(b/'video.mp4'),'-frames:v','1','-vf','scale=48:27,format=gray','-f','rawvideo','-'],capture_output=True,check=True); sig.append(hashlib.sha256(r.stdout).hexdigest())
          u=len(set(sig)); tail=len(set(sig[-5:]))
          if u<7 or tail<4: raise SystemExit(f'FROZEN_TAIL={u}/{tail}')
          print(f'VIDEO_GATES_OK duration={final:.3f} unique={u} tail={tail}')
          PY
      - name: Checkpoint assembled NEW product
        uses: actions/upload-artifact@v4
        with:
          name: flagship-${{ steps.prod.outputs.id }}-assembled
          retention-days: 7
          path: |
            build/${{ steps.prod.outputs.id }}/video.mp4
            build/${{ steps.prod.outputs.id }}/silent.mp4
            productions/${{ steps.prod.outputs.id }}
            build/${{ steps.prod.outputs.id }}/visual-labels.srt
      - name: Generate brand-new local thumbnail (no image API)
        env: {NEW_ID: '${{ steps.prod.outputs.id }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          pid=os.environ['NEW_ID']; w=Path('productions')/pid; b=Path('build')/pid; frame=w/'thumb-frame.jpg'; out=w/'thumbnail.jpg'
          subprocess.run(['ffmpeg','-y','-ss','12','-i',str(b/'silent.mp4'),'-frames:v','1','-q:v','2',str(frame)],check=True,capture_output=True)
          img=ImageOps.fit(Image.open(frame).convert('RGB'),(1280,720),method=Image.Resampling.LANCZOS)
          canvas=Image.new('RGB',(1280,720),(12,24,52)); canvas.paste(img,(16,16,1264,704)); d=ImageDraw.Draw(canvas); d.rectangle((8,8,1272,712),outline=(212,167,73),width=10); d.rectangle((26,26,1254,694),outline=(30,157,255),width=4); canvas.save(out,'JPEG',quality=91,optimize=True,progressive=False)
          print('THUMBNAIL_OK paid_api_calls=0')
          PY
      - name: Full automatic QA
        env: {NEW_ID: '${{ steps.prod.outputs.id }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from golide_engine.quality.runner import QualityRunner
          pid=os.environ['NEW_ID']; w=Path('productions')/pid; b=Path('build')/pid
          s=json.loads((w/'storyboard-authoritative-v5.json').read_text()); m=json.loads((w/'upload-metadata.json').read_text()); script=(w/'script.txt').read_text().strip()
          r=QualityRunner('config/qa-policy.json').run(b/'video.mp4','long',s,[script,m['title'],m['description']],w/'qa-report.json',w/'thumbnail.jpg')
          if not r.passed: raise SystemExit('QA_FAILED='+ '; '.join(r.failures))
          print('QA_OK')
          PY
      - name: Build NEW release package
        env: {NEW_ID: '${{ steps.prod.outputs.id }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from golide_engine.release.package import ReleasePackager
          pid=os.environ['NEW_ID']; src=Path('release-packages')/os.environ['SOURCE_ID']; w=Path('productions')/pid; b=Path('build')/pid; new=Path('release-packages')/pid
          sm=json.loads((src/'package-manifest.json').read_text())
          files={'video':b/'video.mp4','thumbnail':w/'thumbnail.jpg','metadata':w/'upload-metadata.json','spoken_captions':w/'spoken-captions-authoritative-v3.srt','visual_captions':b/'visual-labels.srt','source_ledger':w/'source-ledger.json','generation_parameters':w/'generation-parameters.json','qa_report':w/'qa-report.json'}
          for role in ('metadata','spoken_captions','visual_captions','source_ledger','generation_parameters'):
              if not files[role].is_file(): files[role]=src/sm['files'][role]['file']
          shutil.rmtree(new)
          release={'approved':True,'channel_id':os.environ['CHANNEL_ID'],'scheduled_at':None,'qa':{'passed':True}}
          out=ReleasePackager('release-packages').build(pid,files,release,{'mode':'fresh-product-from-validated-108-scene-cache','source_production_id':os.environ['SOURCE_ID'],'paid_scene_generation':0,'paid_thumbnail_generation':0})
          print('PACKAGE='+str(out))
          PY
          golide release-verify "release-packages/${NEW_ID}"
      - name: Checkpoint NEW release package
        uses: actions/upload-artifact@v4
        with:
          name: flagship-${{ steps.prod.outputs.id }}-release
          retention-days: 30
          path: release-packages/${{ steps.prod.outputs.id }}
      - name: Upload NEW product privately
        env:
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
          NEW_ID: ${{ steps.prod.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_OAUTH_TOKEN_B64"
          mkdir -p .secrets
          printf '%s' "$YOUTUBE_OAUTH_TOKEN_B64" | base64 --decode > .secrets/youtube-token.json
          golide youtube-upload "release-packages/${NEW_ID}" --token .secrets/youtube-token.json
