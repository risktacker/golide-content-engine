name: Edit render (frames across machines)
run-name: "Edit render ${{ inputs.job }}"

# Started by the production / rebuild job (src/golide_engine/edit/remote.py) for a long edit-engine video (owner
# 2026-11-26: "minimise run time; GitHub runs are free, we are public"). The composition is already built and checked;
# each machine films one span of it with HyperFrames (software WebGL, one Chrome), the join job trims each span to its
# exact frames and stitches the picture without re-encoding. No model calls, no cost.
on:
  workflow_dispatch:
    inputs:
      job: { description: "render job (its composition is in R2 under editrender/<job>/)", required: true }
      parts: { description: "JSON list of span numbers", default: "[0,1]" }

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  JOB: ${{ inputs.job }}
  CHROME: /home/runner/chrome-sw
  # 2026-11-26: a living-studio frame in software WebGL can take over a minute (the room redrawn as the camera moves);
  # HyperFrames' watchdog gave up after 60 s of no new frame and the whole render fell back to one machine
  HF_DE_STALL_MS: "900000"
  PRODUCER_PUPPETEER_PROTOCOL_TIMEOUT_MS: "1800000"   # one frame may take minutes; the browser call waits for it

jobs:
  frames:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false            # the other spans finish and are kept for the rerun
      matrix:
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: ./.github/actions/ffmpeg
      - name: HyperFrames (cached)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: edit-render-npm-hyperframes-0.9.32
      - name: Our package, software-WebGL Chrome
        run: |
          pip install -q -e "$GITHUB_WORKSPACE" pillow numpy
          printf '#!/bin/sh\nexec /usr/bin/google-chrome "$@" --use-angle=swiftshader --use-gl=angle --enable-unsafe-swiftshader --ignore-gpu-blocklist\n' > ~/chrome-sw && chmod +x ~/chrome-sw
          npx -y hyperframes@0.9.32 --version
      - name: Film span ${{ matrix.part }}
        run: python3 -m golide_engine.edit.remote part --job "$JOB" --part ${{ matrix.part }} --work "$RUNNER_TEMP/w"

  join:
    needs: frames
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: ./.github/actions/ffmpeg
      - run: pip install -q -e "$GITHUB_WORKSPACE" pillow numpy
      - name: Trim each span to its frames, stitch the picture
        run: python3 -m golide_engine.edit.remote join --job "$JOB" --work "$RUNNER_TEMP/j"

  failed:
    needs: [frames, join]
    if: failure() || cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install -q -e "$GITHUB_WORKSPACE"
          python3 -m golide_engine.edit.remote failed --job "$JOB" \
            --message "edit render run ${{ github.run_id }} failed (frames: ${{ needs.frames.result }}, join: ${{ needs.join.result }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
