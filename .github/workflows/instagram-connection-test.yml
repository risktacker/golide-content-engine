name: Instagram Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-connection-test.yml"
      - "src/golide_engine/providers/meta.py"
      - "src/golide_engine/providers/instagram_verify.py"
      - "src/golide_engine/providers/social_factory.py"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      GOLIDE_META_API_VERSION: ${{ secrets.GOLIDE_META_API_VERSION }}
      INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_USER_ACCESS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify Instagram and sync safe status to Studio
        run: golide connections-sync-studio --platform instagram --require-connected
