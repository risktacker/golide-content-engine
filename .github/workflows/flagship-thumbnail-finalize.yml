name: Flagship thumbnail finalize

on:
  push:
    branches: [codex/final]
    paths: [.github/flagship-thumbnail-finalize-kick]
  workflow_dispatch:

concurrency:
  group: golide-flagship-thumbnail-finalize
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  RELEASE_RUN_ID: '33861278521'
  NEW_ID: golide-long-flagship-33845066363
  CHANNEL_ID: UCqaXVBSBz7iQsRHOupKt-3w

jobs:
  verify-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification runtime
        run: python -m pip install -e '.[production]'
      - name: Download verified release checkpoint
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_RUN_ID }}
          name: flagship-${{ env.NEW_ID }}-release
          path: release-packages/${{ env.NEW_ID }}
      - name: Verify private YouTube upload exists
        env:
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from golide_engine.youtube.auth import credentials, services, assert_channel

          channel_id = os.environ['CHANNEL_ID']
          root = Path('release-packages') / os.environ['NEW_ID']
          manifest = json.loads((root / 'package-manifest.json').read_text(encoding='utf-8'))
          meta_file = manifest['files']['metadata']['file']
          metadata = json.loads((root / meta_file).read_text(encoding='utf-8'))
          target_title = metadata['title']

          youtube, _ = services(credentials())
          assert_channel(youtube, channel_id)
          channel = youtube.channels().list(part='contentDetails', id=channel_id).execute()['items'][0]
          uploads = channel['contentDetails']['relatedPlaylists']['uploads']
          items = youtube.playlistItems().list(
              part='snippet,contentDetails', playlistId=uploads, maxResults=15
          ).execute().get('items', [])
          ids = [x['contentDetails']['videoId'] for x in items if x.get('contentDetails', {}).get('videoId')]
          if not ids:
              raise SystemExit('UPLOAD_VERIFY_NO_RECENT_VIDEOS')
          videos = youtube.videos().list(part='snippet,status', id=','.join(ids)).execute().get('items', [])
          matches = [v for v in videos if v.get('snippet', {}).get('title') == target_title]
          if not matches:
              titles = [v.get('snippet', {}).get('title') for v in videos[:5]]
              raise SystemExit('UPLOAD_VERIFY_TITLE_NOT_FOUND recent=' + repr(titles))
          v = matches[0]
          print(json.dumps({
              'youtube_video_id': v['id'],
              'title': v['snippet']['title'],
              'privacy_status': v['status']['privacyStatus'],
              'upload_status': 'verified_existing_remote_upload'
          }, indent=2))
          PY
