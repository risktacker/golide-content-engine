name: Apply owner script

# 2026-11-05: a rewritten script for a video waiting for its recording. Free: no paid calls.
on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "e.g. golide-long-2026-11-05-r"
        required: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q -e '.[production]'
      - run: python tools/apply_owner_script.py "${{ inputs.production_id }}"
      - name: Commit the plan
        run: |
          git config user.name "golide-production-bot"
          git config user.email "golide-production-bot@users.noreply.github.com"
          git add production-queue/${{ inputs.production_id }}.script-plan.json production-queue/${{ inputs.production_id }}.owner-script-display.txt
          git commit -m "ops: owner script for ${{ inputs.production_id }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
