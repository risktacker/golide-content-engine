name: ElevenLabs check

# 2026-11-06: is the ElevenLabs key still saved, and which plan is it on? Free: reads the account,
# makes no speech, spends no voice credits.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Key and plan
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "KEY: missing"; exit 0; fi
          echo "KEY: saved (${#ELEVENLABS_API_KEY} characters)"
          curl -s -H "xi-api-key: $ELEVENLABS_API_KEY" https://api.elevenlabs.io/v1/user/subscription \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('PLAN:', d.get('tier'), '| used', d.get('character_count'), 'of', d.get('character_limit'), '| status', d.get('status')) if 'tier' in d else print('PLAN: not readable with this key:', str(d)[:160])"
          echo "MY VOICES:"
          curl -s -H "xi-api-key: $ELEVENLABS_API_KEY" "https://api.elevenlabs.io/v2/voices?page_size=100" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print('  VOICE:', v.get('name'), '|', v.get('voice_id'), '|', v.get('category')) for v in d.get('voices',[])] if 'voices' in d else print('  not readable:', str(d)[:160])"
          echo "LIBRARY SEARCH Mark:"
          curl -s -H "xi-api-key: $ELEVENLABS_API_KEY" "https://api.elevenlabs.io/v1/shared-voices?search=Mark&page_size=10" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [print('  LIB:', v.get('name'), '|', v.get('voice_id'), '|', v.get('public_owner_id'), '|', v.get('accent'), v.get('age'), '| used', v.get('usage_character_count_1y') or v.get('cloned_by_count')) for v in d.get('voices',[])] if 'voices' in d else print('  not readable:', str(d)[:160])"
