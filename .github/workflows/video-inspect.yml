name: Video inspect (freezes and stills, text only)
# Reads a finished video from R2 and reports, as text in the log, where the picture freezes or holds still: nothing
# from the video leaves the machine (owner 2026-11-27: "the blocks stopped").
on:
  workflow_dispatch:
    inputs:
      ref: { description: "r2:// media of the finished video", required: true }
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q -e "$GITHUB_WORKSPACE"
      - run: |
          python3 -c "
          import os, urllib.request
          from golide_engine.storage.r2 import r2_store_from_environment
          url = r2_store_from_environment().resolve(os.environ['REF'], expires_seconds=900)
          open('/tmp/v.mp4','wb').write(urllib.request.urlopen(url, timeout=600).read())"
          ffprobe -v error -show_entries format=duration:stream=nb_frames,r_frame_rate,width,height -of compact /tmp/v.mp4
          echo "== picture freezes (still for 0.6 s or more)"
          ffmpeg -nostats -i /tmp/v.mp4 -vf "freezedetect=n=0.002:d=0.6" -map 0:v -f null - 2>&1 | grep -oE "freeze_(start|end|duration): [0-9.]+" | paste - - - || true
          echo "== motion per half second (mean change between frames, 0 = still)"
          ffmpeg -nostats -i /tmp/v.mp4 -vf "scale=320:-1,tblend=all_mode=difference,signalstats,metadata=print:key=lavfi.signalstats.YAVG" -f null - 2>&1 \
            | grep -oE "pts_time:[0-9.]+|YAVG=[0-9.]+" | paste - - | awk -F'[: =]' '{t=$2; b=int(t*2)/2; s[b]+=$4; n[b]++} END {for (k in s) printf "%6.1f %.2f\n", k, s[k]/n[k]}' | sort -n
          echo "== empty picture area (the block's area, Goli's corner and captions left out) per half second"
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 /tmp/v.mp4)
          if [ "$W" -gt 1500 ]; then CROP="crop=1300:880:20:20"; else CROP="crop=900:1000:90:200"; fi
          ffmpeg -nostats -i /tmp/v.mp4 -vf "fps=2,$CROP,scale=320:-1,signalstats,metadata=print:key=lavfi.signalstats.YHIGH" -f null - 2>&1 \
            | grep -oE "pts_time:[0-9.]+|YHIGH=[0-9.]+" | paste - - | awk -F'[: =]' '{ if ($4 < 70) printf "%s ", $2 } END {print ""}'
