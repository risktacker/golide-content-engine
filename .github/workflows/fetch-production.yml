name: Fetch a production's files

# 2026-11-13: hand back a finished video's render, edit plan, scripts and audio from the run checkpoint, so it can
# be reviewed frame by frame.
on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "Production id, e.g. golide-long-2026-11-12-r"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - name: List what the checkpoint holds
        run: |
          ls -la "productions/${{ inputs.production_id }}" || (ls productions; exit 1)
          find "productions/${{ inputs.production_id }}" -maxdepth 3 -type f -size +1k | head -200
      - name: Frames, contact sheets and the plan onto a review branch
        env:
          PID: ${{ inputs.production_id }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          W="productions/$PID"
          OUT="review/$PID"
          mkdir -p "$OUT/frames" "$OUT/files"
          VIDEO=$(find "$W" -name "*.mp4" -size +5M -printf "%s %p\n" | sort -n | tail -1 | cut -d' ' -f2-)
          echo "video: ${VIDEO:-none yet}"
          if [ -n "$VIDEO" ]; then
            ffprobe -v error -show_entries format=duration:stream=width,height,codec_type -of json "$VIDEO" > "$OUT/probe.json"
            # one frame every 2 s at 480 px, and contact sheets of 40 s (5 x 4)
            ffmpeg -v error -i "$VIDEO" -vf "fps=1/2,scale=480:-2" -q:v 4 "$OUT/frames/f%04d.jpg"
            ffmpeg -v error -i "$VIDEO" -vf "fps=1/2,scale=384:-2,drawtext=text='%{pts\:hms}':x=6:y=6:fontsize=18:fontcolor=yellow:box=1:boxcolor=black@0.6,tile=5x4" -q:v 4 "$OUT/sheet%02d.jpg"
            # loudness and silences of the final mix
            ffmpeg -v info -i "$VIDEO" -af "silencedetect=n=-38dB:d=0.35,ebur128" -f null - 2> "$OUT/audio.txt" || true
          fi
          find "$W" -maxdepth 3 -type f \( -name "*.json" -o -name "*.txt" -o -name "*.md" \) -size -2M -exec cp --parents {} "$OUT/files" \;
          git config user.name "golide-bot" && git config user.email "bot@golidee.com"
          git checkout -b "review-$PID"
          git add -f review && git commit -qm "Review files for $PID"
          git push -f origin "review-$PID"
