name: Uploaded media retention cleanup

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest resumable media checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-retention-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Purge only media 48h after confirmed YouTube upload
        run: golide retention-cleanup

      - name: Save cleaned checkpoint
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-retention-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist lightweight records and cleanup state
        run: |
          git config user.name "golide-retention-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ops: record 48h media retention cleanup"
          git push

      - name: Remove superseded Actions caches older than the safety window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '50 hours ago' +%s)"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key,.created_at] | @tsv' | \
          while IFS=$'\t' read -r id key created; do
            case "$key" in
              golide-production-checkpoint-*) ;;
              *) continue ;;
            esac
            created_epoch="$(date -u -d "$created" +%s)"
            if [ "$created_epoch" -lt "$cutoff" ]; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            fi
          done
