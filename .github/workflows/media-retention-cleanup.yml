name: Uploaded media retention cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/media-retention-cleanup.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest resumable media checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-retention-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-

      - name: Report restored checkpoint size
        run: |
          du -sh productions build release-packages generated 2>/dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e .

      - name: Purge only media 48h after confirmed YouTube upload
        id: retention
        run: |
          set -euo pipefail
          golide retention-cleanup | tee retention-cleanup.json
          if grep -Eq '"purged"[[:space:]]*:[[:space:]]*\[[[:space:]]*\]' retention-cleanup.json; then
            echo "purged=false" >> "$GITHUB_OUTPUT"
          else
            echo "purged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save cleaned checkpoint only when media was actually purged
        if: steps.retention.outputs.purged == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-retention-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Persist lightweight records and cleanup state
        run: |
          git config user.name "golide-retention-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ops: record 48h media retention cleanup"
          git push

      - name: Remove superseded Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache_file="$RUNNER_TEMP/golide-actions-caches.tsv"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key,.created_at,.size_in_bytes] | @tsv' > "$cache_file"

          newest_checkpoint_id=""
          newest_checkpoint_epoch=0

          while IFS=$'\t' read -r id key created size; do
            case "$key" in
              golide-production-checkpoint-*)
                created_epoch="$(date -u -d "$created" +%s)"
                if [ "$created_epoch" -gt "$newest_checkpoint_epoch" ]; then
                  newest_checkpoint_epoch="$created_epoch"
                  newest_checkpoint_id="$id"
                fi
                ;;
            esac
          done < "$cache_file"

          if [ -z "$newest_checkpoint_id" ]; then
            echo "No resumable production checkpoint found; refusing cleanup."
            exit 1
          fi

          echo "Preserving newest resumable checkpoint cache id: $newest_checkpoint_id"

          while IFS=$'\t' read -r id key created size; do
            delete=false
            case "$key" in
              golide-production-checkpoint-*)
                if [ "$id" != "$newest_checkpoint_id" ]; then
                  delete=true
                fi
                ;;
              golide-production-correction-*|golide-flagship-scene-repair-*)
                delete=true
                ;;
              *)
                continue
                ;;
            esac

            if [ "$delete" = true ]; then
              echo "Deleting superseded cache: $key (${size} bytes)"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
            else
              echo "Keeping current resumable checkpoint: $key (${size} bytes)"
            fi
          done < "$cache_file"
