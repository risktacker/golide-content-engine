name: Reel cover

# 2026-10-31: the reel cover for one long video uploaded before covers were automatic.
on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "Long video id, e.g. golide-long-2026-10-31"
        required: true
  push:
    branches: [main]
    paths: [".github/reel-cover-request.txt"]

permissions:
  contents: read

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libcairo2-dev pkg-config >/dev/null
      - run: python -m pip install -q -e '.[production,video]'
      - name: Draw and email the cover
        env:
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python tools/reel_cover.py "${{ inputs.production_id || 'golide-long-2026-10-31' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-cover
          path: reel-covers/*.jpg
          if-no-files-found: ignore
