# Diagnosis helper: hands one production's storyboard and source pictures over on a
# temporary branch (inspect-tmp) so they can be checked outside the runner.
name: Inspect illustrations

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Production id"
        required: true

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore the latest production checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
          key: golide-inspect-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-

      - name: Hand over on a temporary branch
        env:
          PID: ${{ inputs.production }}
        run: |
          set -euo pipefail
          work="productions/$PID"
          test -d "$work" || { echo "::error::no checkpoint for $PID"; exit 1; }
          mkdir -p /tmp/out
          cp "$work/visual-plan.json" /tmp/out/ 2>/dev/null || true
          cp -r "$work/illustrations" /tmp/out/ 2>/dev/null || true
          git config user.name "golide-engine"
          git config user.email "engine@golidee.com"
          git checkout --orphan inspect-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/out/* .
          git add -A
          git commit -m "Inspect $PID (temporary)"
          git push -f origin inspect-tmp
