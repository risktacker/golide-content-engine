name: Deploy GOLIDE Studio to Cloudflare

on:
  workflow_dispatch:
  # Turn on automatic deploys after the first manual deploy is verified:
  # push:
  #   branches: [main]
  #   paths: ["worker/**", "app/**", "wrangler.jsonc"]

permissions:
  contents: read

concurrency:
  group: cloudflare-studio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check worker/index.js && node --check worker/social-oauth.js && node --check app/app.js
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
