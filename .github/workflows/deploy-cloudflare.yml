name: Deploy GOLIDE Studio to Cloudflare

on:
  workflow_dispatch:
  # Test deploys: pushing the migration branch deploys to *.workers.dev only
  # (no custom domain is attached yet, so live sites are untouched).
  push:
    branches: [cloudflare-migration]
  # Turn on automatic deploys after the first manual deploy is verified:
  # push:
  #   branches: [main]
  #   paths: ["worker/**", "app/**", "wrangler.jsonc"]

permissions:
  contents: read

concurrency:
  group: cloudflare-studio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check worker/index.js && node --check worker/social-oauth.js && node --check app/app.js
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Sync R2 secrets from GitHub into the Worker
        # Copies the R2 keys already stored as GitHub secrets, so they are not
        # entered twice. Values never appear in logs.
        run: |
          set -euo pipefail
          jq -n \
            --arg a "$R2_ACCOUNT_ID" --arg k "$R2_ACCESS_KEY_ID" \
            --arg s "$R2_SECRET_ACCESS_KEY" --arg b "$R2_BUCKET" \
            '{R2_ACCOUNT_ID:$a, R2_ACCESS_KEY_ID:$k, R2_SECRET_ACCESS_KEY:$s, R2_BUCKET:$b}
             | with_entries(select(.value != ""))' > r2-secrets.json
          npx --yes wrangler@4 secret bulk r2-secrets.json
          rm -f r2-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
