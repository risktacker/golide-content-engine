name: LinkedIn Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linkedin-connection-test.yml"
      - "src/golide_engine/providers/linkedin_verify.py"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      GOLIDE_LINKEDIN_AUTHOR_URN: ${{ secrets.GOLIDE_LINKEDIN_AUTHOR_URN }}
      GOLIDE_LINKEDIN_VERSION: ${{ secrets.GOLIDE_LINKEDIN_VERSION }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify LinkedIn and sync safe status to Studio
        run: golide connections-sync-studio --platform linkedin --require-connected
