name: Facebook Page Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/facebook-page-connection-test.yml"
      - "src/golide_engine/providers/facebook_verify.py"

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      GOLIDE_META_API_VERSION: ${{ secrets.GOLIDE_META_API_VERSION }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      GOLIDE_FACEBOOK_PAGE_ID: ${{ secrets.GOLIDE_FACEBOOK_PAGE_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify Facebook Page and sync safe status to Studio
        run: golide connections-sync-studio --platform facebook --require-connected
