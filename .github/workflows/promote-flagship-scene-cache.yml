name: Promote corrected flagship scene cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/promote-flagship-scene-cache-kick"

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote-corrected-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_ID: golide-long-flagship-2026-09-03
      CORRECTED_SCENE_CACHE: golide-production-correction-flagship-2026-09-03-33805778023-scene-fixed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact corrected scene-art checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: ${{ env.CORRECTED_SCENE_CACHE }}
          fail-on-cache-miss: true

      - name: Verify corrected scene batch and canonical avatar before long render
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from golide_engine.visual_identity import VisualIdentity

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          report_path = work / 'scene-art-correction-report.json'
          if not report_path.is_file():
              raise SystemExit('BLOCKED: exact corrected scene-art report is missing')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('replaced_count') != 9:
              raise SystemExit(f"BLOCKED: expected 9 corrected artworks, found {report.get('replaced_count')}")
          if len(report.get('kept_good_cached_art', [])) != 3:
              raise SystemExit('BLOCKED: corrected scene batch does not preserve exactly 3 known-good artworks')
          if report.get('policy') != 'topic-first-no-generic-presenter-no-baked-text':
              raise SystemExit('BLOCKED: corrected scene-art policy marker is missing')

          render = json.loads((work / 'render-manifest.json').read_text(encoding='utf-8'))
          if len(render.get('scenes', [])) != 108:
              raise SystemExit('BLOCKED: corrected checkpoint is not the 108-scene edit')

          # Safe metadata-only diagnostics for the checked-in canonical source. Never print
          # source/base64/image bytes; only lengths, hashes and JPEG boundary flags.
          cfg = json.loads(Path('config/visual-identity.json').read_text(encoding='utf-8'))
          expected = cfg['avatar']['canonical_reference_sha256']
          source = Path(cfg['avatar']['canonical_reference_b64'])
          raw_bytes = source.read_bytes()
          raw = raw_bytes.decode('ascii').strip()
          normalized = ''.join(raw.replace('\\r\\n','').replace('\\n','').replace('\\r','').replace('\\t','').split())
          print(f'AVATAR_DIAG_SOURCE=raw_bytes:{len(raw_bytes)}|raw_sha:{hashlib.sha256(raw_bytes).hexdigest()}|normalized_chars:{len(normalized)}|normalized_sha:{hashlib.sha256(normalized.encode()).hexdigest()}|expected:{expected}')
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          encoded = ''.join(ch for ch in normalized if ch in alphabet)
          print(f'AVATAR_DIAG_BASE64=filtered_chars:{len(encoded)}|padding_count:{encoded.count("=")}')

          chunks = re.findall(r'[A-Za-z0-9+/]+={1,2}', encoded)
          decoded_chunks = []
          for i, chunk in enumerate(chunks[:20]):
              try:
                  decoded = base64.b64decode(chunk, validate=True)
              except Exception:
                  continue
              decoded_chunks.append(decoded)
              sha = hashlib.sha256(decoded).hexdigest()
              print(f'AVATAR_DIAG_CHUNK={i}|chars:{len(chunk)}|bytes:{len(decoded)}|sha:{sha}|jpeg_start:{decoded.startswith(bytes.fromhex("ffd8ff"))}|jpeg_end:{decoded.endswith(bytes.fromhex("ffd9"))}|matches_expected:{sha==expected}')
          if decoded_chunks:
              joined = b''.join(decoded_chunks)
              sha = hashlib.sha256(joined).hexdigest()
              print(f'AVATAR_DIAG_JOINED=chunks:{len(decoded_chunks)}|bytes:{len(joined)}|sha:{sha}|jpeg_start:{joined.startswith(bytes.fromhex("ffd8ff"))}|jpeg_end:{joined.endswith(bytes.fromhex("ffd9"))}|matches_expected:{sha==expected}')

          avatar = VisualIdentity('config/visual-identity.json').canonical_avatar_reference()
          if not avatar.is_file() or avatar.stat().st_size < 10_000:
              raise SystemExit('BLOCKED: canonical avatar did not decode to a usable image')
          print(f'CORRECTED_CACHE_PREFLIGHT=passed|replaced=9|kept=3|avatar_bytes={avatar.stat().st_size}')
          PY

      - name: Promote corrected cache as newest correction checkpoint
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-flagship-2026-09-03-${{ github.run_id }}-scene-fixed-promoted

      - name: Trigger corrected re-edit without regenerating paid stages
        run: |
          set -euo pipefail
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' "promoted-scene-cache-${GITHUB_RUN_ID}-${GITHUB_SHA}" > .github/production-correction-kick
          git add .github/production-correction-kick
          git commit -m "ops: resume flagship from corrected scene checkpoint"
          git pull --rebase origin main
          git push
