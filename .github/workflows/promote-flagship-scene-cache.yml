name: Promote corrected flagship scene cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/promote-flagship-scene-cache-kick"

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote-corrected-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_ID: golide-long-flagship-2026-09-03
      CORRECTED_SCENE_CACHE: golide-production-correction-flagship-2026-09-03-33805778023-scene-fixed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact corrected scene-art checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: ${{ env.CORRECTED_SCENE_CACHE }}
          fail-on-cache-miss: true

      - name: Verify corrected scene batch and recover verified canonical avatar if needed
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          from golide_engine.visual_identity import VisualIdentity

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          report = json.loads((work / 'scene-art-correction-report.json').read_text(encoding='utf-8'))
          if report.get('replaced_count') != 9 or len(report.get('kept_good_cached_art', [])) != 3:
              raise SystemExit('BLOCKED: corrected 9-replaced/3-kept scene checkpoint is invalid')
          if report.get('policy') != 'topic-first-no-generic-presenter-no-baked-text':
              raise SystemExit('BLOCKED: corrected scene-art policy marker is missing')
          render = json.loads((work / 'render-manifest.json').read_text(encoding='utf-8'))
          if len(render.get('scenes', [])) != 108:
              raise SystemExit('BLOCKED: corrected checkpoint is not the 108-scene edit')

          config_path = Path('config/visual-identity.json')
          cfg = json.loads(config_path.read_text(encoding='utf-8'))
          source_path = Path(cfg['avatar']['canonical_reference_b64'])
          trusted_hashes = {
              '20df496e51d6af9d7e31008762100c0a07d7b307a2d2e8bb4c5f43e8f4809727',
              'ef154d9bb69139f46b0ea6b90419ae7eda2394e2b037273eb416bc7f5139549a',
              'ba957904693cb273772a95e6a081a022bbf37d3ccd2d817302b53a5cdaeaa226',
          }

          def decode_candidate(text: str):
              raw = ''.join(text.strip().replace('\\r\\n','').replace('\\n','').replace('\\r','').replace('\\t','').split())
              try:
                  data = base64.b64decode(raw, validate=True)
              except Exception:
                  return None
              sha = hashlib.sha256(data).hexdigest()
              complete_jpeg = data.startswith(bytes.fromhex('ffd8ff')) and data.endswith(bytes.fromhex('ffd9'))
              return data, sha, complete_jpeg

          current = decode_candidate(source_path.read_text(encoding='ascii'))
          chosen = None
          if current:
              data, sha, complete = current
              print(f'AVATAR_CURRENT=bytes:{len(data)}|sha:{sha}|complete_jpeg:{complete}|trusted:{sha in trusted_hashes}')
              if complete and sha in trusted_hashes:
                  chosen = (data, sha, 'current')
          else:
              print('AVATAR_CURRENT=strict_decode_failed')

          history = [
              ('df2648627f0ff36ab5ab1722b34f5670774b5adb', 'restore-decodable-source'),
              ('7662e2dfe42c2d1a50648c631fdd8bf965c9f556', 'compact-reference'),
              ('b937d86f2986e20ed0277f4255783a1808bbf65f', 'initial-canonical-reference'),
          ]
          if chosen is None:
              for ref, label in history:
                  try:
                      text = subprocess.check_output(
                          ['git', 'show', f'{ref}:{source_path.as_posix()}'],
                          text=True,
                          stderr=subprocess.DEVNULL,
                      )
                  except subprocess.CalledProcessError:
                      print(f'AVATAR_HISTORY={label}|missing')
                      continue
                  candidate = decode_candidate(text)
                  if not candidate:
                      print(f'AVATAR_HISTORY={label}|strict_decode_failed')
                      continue
                  data, sha, complete = candidate
                  print(f'AVATAR_HISTORY={label}|bytes:{len(data)}|sha:{sha}|complete_jpeg:{complete}|trusted:{sha in trusted_hashes}')
                  if complete and sha in trusted_hashes:
                      chosen = (data, sha, label)
                      break

          if chosen is None:
              raise SystemExit('BLOCKED: no complete canonical JPEG matching a previously verified hash exists in repository history')

          data, sha, provenance = chosen
          if provenance != 'current' or cfg['avatar']['canonical_reference_sha256'] != sha:
              source_path.write_text(base64.b64encode(data).decode('ascii') + '\n', encoding='ascii')
              cfg['avatar']['canonical_reference_sha256'] = sha
              config_path.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')
              print(f'AVATAR_RECOVERED=provenance:{provenance}|bytes:{len(data)}|sha:{sha}')

          avatar = VisualIdentity(config_path).canonical_avatar_reference()
          b = avatar.read_bytes()
          if len(b) < 4_000 or not b.startswith(bytes.fromhex('ffd8ff')) or not b.endswith(bytes.fromhex('ffd9')):
              raise SystemExit('BLOCKED: recovered canonical avatar is not a complete usable JPEG')
          if hashlib.sha256(b).hexdigest() != sha:
              raise SystemExit('BLOCKED: recovered canonical avatar failed locked checksum verification')
          print(f'CORRECTED_CACHE_PREFLIGHT=passed|replaced=9|kept=3|avatar_bytes={len(b)}|avatar_sha={sha}|avatar_provenance={provenance}')
          PY

      - name: Persist canonical avatar recovery when required
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/brand/golide-canonical-avatar-v1.jpg.b64 config/visual-identity.json; then
            echo "AVATAR_REPO_REPAIR=not_required"
            exit 0
          fi
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/brand/golide-canonical-avatar-v1.jpg.b64 config/visual-identity.json
          git commit -m "fix: restore verified canonical avatar bytes"
          git pull --rebase origin main
          git push
          echo "AVATAR_REPO_REPAIR=committed"

      - name: Promote corrected cache as newest correction checkpoint
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-flagship-2026-09-03-${{ github.run_id }}-scene-fixed-promoted

      - name: Trigger corrected re-edit without regenerating paid stages
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' "promoted-scene-cache-${GITHUB_RUN_ID}-${GITHUB_SHA}" > .github/production-correction-kick
          git add .github/production-correction-kick
          git commit -m "ops: resume flagship from corrected scene checkpoint"
          git pull --rebase origin main
          git push
