name: Promote corrected flagship scene cache

on:
  push:
    branches: ["main"]
    paths:
      - ".github/promote-flagship-scene-cache-kick"

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote-corrected-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_ID: golide-long-flagship-2026-09-03
      CORRECTED_SCENE_CACHE: golide-production-correction-flagship-2026-09-03-33805778023-scene-fixed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact corrected scene-art checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: ${{ env.CORRECTED_SCENE_CACHE }}
          fail-on-cache-miss: true

      - name: Verify corrected scene batch and canonical avatar before long render
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          from golide_engine.visual_identity import VisualIdentity

          pid = os.environ['PRODUCTION_ID']
          work = Path('productions') / pid
          report = json.loads((work / 'scene-art-correction-report.json').read_text(encoding='utf-8'))
          if report.get('replaced_count') != 9 or len(report.get('kept_good_cached_art', [])) != 3:
              raise SystemExit('BLOCKED: corrected 9-replaced/3-kept scene checkpoint is invalid')
          if report.get('policy') != 'topic-first-no-generic-presenter-no-baked-text':
              raise SystemExit('BLOCKED: corrected scene-art policy marker is missing')
          render = json.loads((work / 'render-manifest.json').read_text(encoding='utf-8'))
          if len(render.get('scenes', [])) != 108:
              raise SystemExit('BLOCKED: corrected checkpoint is not the 108-scene edit')

          cfg = json.loads(Path('config/visual-identity.json').read_text(encoding='utf-8'))
          expected = cfg['avatar']['canonical_reference_sha256']
          source = Path(cfg['avatar']['canonical_reference_b64'])
          raw = source.read_text(encoding='ascii').strip()
          normalized = ''.join(raw.replace('\\r\\n','').replace('\\n','').replace('\\r','').replace('\\t','').split())
          alphabet = set('ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=')
          encoded = ''.join(ch for ch in normalized if ch in alphabet)
          print(f'AVATAR_DIAG=raw:{source.stat().st_size}|encoded:{len(encoded)}|pads:{encoded.count("=")}|expected:{expected}')
          try:
              permissive = base64.b64decode(encoded, validate=False)
              start = permissive.find(bytes.fromhex('ffd8ff'))
              end = permissive.find(bytes.fromhex('ffd9'), start + 3) if start >= 0 else -1
              if start >= 0 and end >= 0:
                  jpeg = permissive[start:end+2]
                  print(f'AVATAR_JPEG_CANDIDATE=bytes:{len(jpeg)}|sha:{hashlib.sha256(jpeg).hexdigest()}|whole_sha:{hashlib.sha256(permissive).hexdigest()}')
              else:
                  print(f'AVATAR_PERMISSIVE=bytes:{len(permissive)}|sha:{hashlib.sha256(permissive).hexdigest()}|jpeg_start:{start}|jpeg_end:{end}')
          except Exception as exc:
              print(f'AVATAR_PERMISSIVE_ERROR={type(exc).__name__}:{exc}')

          avatar = VisualIdentity('config/visual-identity.json').canonical_avatar_reference()
          if not avatar.is_file() or avatar.stat().st_size < 10_000:
              raise SystemExit('BLOCKED: canonical avatar did not decode to a usable image')
          print(f'CORRECTED_CACHE_PREFLIGHT=passed|replaced=9|kept=3|avatar_bytes={avatar.stat().st_size}')
          PY

      - name: Promote corrected cache as newest correction checkpoint
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-flagship-2026-09-03-${{ github.run_id }}-scene-fixed-promoted

      - name: Trigger corrected re-edit without regenerating paid stages
        run: |
          set -euo pipefail
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' "promoted-scene-cache-${GITHUB_RUN_ID}-${GITHUB_SHA}" > .github/production-correction-kick
          git add .github/production-correction-kick
          git commit -m "ops: resume flagship from corrected scene checkpoint"
          git pull --rebase origin main
          git push
