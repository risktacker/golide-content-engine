name: Daily YouTube analytics

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  collect:
    if: vars.GOLIDE_ANALYTICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
      - name: Collect and score
        env:
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
        run: |
          golide analytics-collect
          golide feedback-recalculate
      - name: Save private analytics database
        run: |
          git config user.name "golide-analytics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/golide.sqlite3
          git diff --cached --quiet || git commit -m "data: collect daily YouTube analytics"
          git push
      - name: Open one analytics failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'GOLIDE daily analytics failed';
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open'});
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            }
