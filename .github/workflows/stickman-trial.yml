name: Stickman trial

# TRIAL (owner 2026-11-17): a Stickman video (optionally with Goli beside it) made from a finished production's own
# voice, word timings and research. Only the storyboard writer is new spend. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      ref:
        default: edit-engine
      production_id:
        description: "A finished production id, or latest-long / latest-short"
        required: true
      goli:
        description: "goli = Goli beside the Stickman video; anything else = Stickman only"
        default: goli

permissions:
  contents: write      # the trial's stills and logs go to the trial-results branch

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - name: Pick the production (latest-long / latest-short = the newest finished one in the checkpoint)
        id: pick
        run: |
          for d in productions/*/; do echo "$d: $(ls "$d" | grep -E 'narration|research|timed-words' | tr '\n' ' ')"; done
          PID="${{ inputs.production_id }}"
          case "$PID" in latest-*)
            F="${PID#latest-}"
            PID=$(ls -t productions | grep -- "-$F-" | grep -v '\.' | while read d; do
              [ -f "productions/$d/narration-owner.wav" ] && [ -f "productions/$d/research.json" ] && echo "$d" && break; done)
          esac
          ls "productions/$PID/narration-owner.wav" "productions/$PID/research.json"
          echo "pid=$PID" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config
      - run: python -m pip install -e '.[production,video]'
      - run: python -m playwright install --with-deps chromium
      - name: Rhubarb Lip Sync (Goli's mouth)
        run: |
          R="$HOME/.cache/golide-rhubarb"; mkdir -p "$R"
          curl -sSL -o "$R/r.zip" https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip
          unzip -qo "$R/r.zip" -d "$R"
      - name: TRIAL Stickman
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/stickman_trial.py "${{ steps.pick.outputs.pid }}" "${{ inputs.goli }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stickman-trial
          path: |
            build/stickman-trial/*/*.mp4
            build/stickman-trial/*/*.jpg
            build/stickman-trial/*/*.json
            build/stickman-trial/*/*.js
            build/stickman-trial/*/*.md
      - name: Results to the trial-results branch (readable where artifact downloads are not)
        if: always()
        run: |
          set -e
          R=$(mktemp -d)
          cp -r build/stickman-trial/. "$R/" 2>/dev/null || true
          find "$R" -type f -size +45M -delete
          find "$R" -type d -name stickman -o -type d -name stickman-short -o -type d -name goli | xargs rm -rf
          cd "$R"
          git init -q && git checkout -q -b trial-results
          git config user.name "golide-trial" && git config user.email "trial@golidee.com"
          git add -A && git commit -qm "Stickman trial ${{ github.run_id }}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" trial-results
