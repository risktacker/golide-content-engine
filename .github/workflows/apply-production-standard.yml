name: Apply locked production standard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-production-standard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch production orchestration without paid API calls
        run: python tools/apply_production_standard.py
      - name: Compile patched orchestrator
        run: python -m compileall -q src/golide_engine/orchestration/production.py
      - name: Commit production standard
        run: |
          git config user.name "golide-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/golide_engine/orchestration/production.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement premium narration visual and spend pipeline"
          git push
