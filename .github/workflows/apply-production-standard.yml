name: Apply locked production standard

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-production-standard.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply fresh trending-topic selection fix
        run: python tools/fix_topic_selection.py
      - name: Compile patched orchestrator
        run: python -m compileall -q src/golide_engine/orchestration/production.py
      - name: Commit fresh topic selection
        run: |
          git config user.name "golide-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/golide_engine/orchestration/production.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: force fresh trending topic discovery for scheduled production"
          # Another push may have landed meanwhile: rebase onto it and retry.
          for attempt in 1 2 3 4 5; do
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          done
