name: Edit render probe (which moment hangs)
# Films half a second at each given moment of a split-render job with HyperFrames, as the filming machines do; a
# moment that hangs fails after 3 minutes without a new frame.
on:
  workflow_dispatch:
    inputs:
      job: { description: "render job (editrender/<job>/ in R2)", required: true }
      times: { description: "JSON list of seconds, one machine each", default: "[150]" }
permissions:
  contents: read
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  HF_DE_STALL_MS: "180000"
  HYPERFRAMES_BROWSER_PATH: /home/runner/chrome-sw
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(inputs.times) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: ./.github/actions/ffmpeg
      - run: |
          pip install -q -e "$GITHUB_WORKSPACE" pillow numpy
          printf '#!/bin/sh\nexec /usr/bin/google-chrome "$@" --use-angle=swiftshader --use-gl=angle --enable-unsafe-swiftshader --ignore-gpu-blocklist\n' > ~/chrome-sw && chmod +x ~/chrome-sw
          python3 - <<'PY'
          import io, tarfile
          from golide_engine.edit import remote
          with tarfile.open(fileobj=io.BytesIO(remote.get("${{ inputs.job }}", "bundle.tgz")), mode="r:gz") as t: t.extractall("w", filter="data")
          PY
      - name: Switch off layers (moment "T|layer-regex")
        run: |
          OFF=$(python3 -c "print('${{ matrix.t }}'.partition('|')[2])")
          [ -z "$OFF" ] && exit 0
          export OFF
          python3 - <<'PY'
          import os, re
          p = "w/composition/index.html"; h = open(p).read()
          if os.environ["OFF"] == "novideo":            # every <video> out of the film
              open(p, "w").write(re.sub(r"<video\b[^>]*>.*?</video>|<video\b[^>]*/>", "", h, flags=re.S)); raise SystemExit
          if os.environ["OFF"] in ("nostand", "noroom"):   # only the standing Goli / only the 3D room never loads
              pat = r'<script type="module">[^<]*?goli_live[^<]*?</script>' if os.environ["OFF"] == "nostand" else \
                    r'<script type="module">[^<]*?studio_live[^<]*?</script>'
              open(p, "w").write(re.sub(pat, "", h, flags=re.S)); raise SystemExit
          if os.environ["OFF"] == "workers1":
              open("workers.txt", "w").write("1"); raise SystemExit
          if os.environ["OFF"] in ("nometa", "nolive"):  # only the metaphors / only the living studio never load
              pat = r'<script type="module">[^<]*?metaphor3d[^<]*?</script>' if os.environ["OFF"] == "nometa" else \
                    r'<script type="module">[^<]*?(?:studio_live|goli_live)[^<]*?</script>'
              open(p, "w").write(re.sub(pat, "", h, flags=re.S)); raise SystemExit
          if os.environ["OFF"] == "no3d":               # no WebGL at all: the 3D modules never load
              h = re.sub(r'<script type="module">[^<]*?g3d/[^<]*?</script>', "", h, flags=re.S)
              open(p, "w").write(h.replace("Promise.all(window.__liveWaits||[]).then(function(){", "(function(){")); raise SystemExit
          js = ("<script>Promise.all(window.__liveWaits||[]).then(function(){var re=new RegExp(%r);"
                "Object.keys(window.__g3d||{}).forEach(function(k){if(re.test(k))window.__g3d[k]=function(){};});});</script>") % __import__("os").environ["OFF"]
          open(p, "w").write(h.replace("</body>", js + "</body>"))
          PY
      - run: |
          T=$(python3 -c "print('${{ matrix.t }}'.partition('|')[0])"); E=$(python3 -c "print($T + 0.5)")
          if timeout 900 npx -y hyperframes@0.9.32 render w/composition -o at.mp4 --fps 30 --quality draft --start "$T" --end "$E" --workers "$(cat workers.txt 2>/dev/null || echo auto)" --quiet > out.txt 2>&1; then
            echo "PROBE_OK $T at=${{ matrix.t }}"
          else
            echo "PROBE_HANG $T at=${{ matrix.t }}"; grep -i "stalled\|error\|timed out" out.txt | tail -5
          fi
