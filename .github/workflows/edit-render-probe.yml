name: Edit render probe (time each 3D layer)
on:
  workflow_dispatch:
    inputs:
      job: { description: "render job (editrender/<job>/ in R2)", required: true }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e "$GITHUB_WORKSPACE" playwright
      - run: timeout 3300 python3 -u tools/edit_render_probe.py "${{ inputs.job }}"
