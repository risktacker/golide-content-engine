name: Edit render probe (which moment hangs)
on:
  workflow_dispatch:
    inputs:
      job: { description: "render job (editrender/<job>/ in R2)", required: true }
      times: { description: "JSON list of seconds to seek to, one machine each", default: "[150]" }
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        t: ${{ fromJSON(inputs.times) }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -e "$GITHUB_WORKSPACE" playwright
      - run: timeout 1200 python3 -u tools/edit_render_probe.py "${{ inputs.job }}" "${{ matrix.t }}" || echo "HUNG_OR_FAILED at ${{ matrix.t }}"
