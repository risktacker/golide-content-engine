name: World 3D trial
# TRIAL only. Runs when world3d/trials/run.json changes (each change is one paid run, capped in the file).
on:
  workflow_dispatch:
  push:
    branches: ["world3d-*"]
    paths: ["world3d/trials/run.json"]
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: blender_python
        with:
          python-version: "3.13"
      - run: |
          "${{ steps.blender_python.outputs.python-path }}" -m venv "$RUNNER_TEMP/blender"
          "$RUNNER_TEMP/blender/bin/pip" install -q bpy numpy pillow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q numpy pillow openai
      - run: python world3d/trial.py world3d/trials/run.json --blender-python "$RUNNER_TEMP/blender/bin/python" --out out
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world3d-trial
          path: |
            out/contact-sheet.jpg
            out/report.json
            out/blueprint-*.json
            out/3d/shot*/*.json
          retention-days: 14
