name: World 3D check
on:
  workflow_dispatch:
  push:
    branches: ["world3d-*"]
    paths: ["world3d/**", "src/golide_engine/explain3d/**", "src/golide_engine/vector/clips.py"]
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: blender_python
        with:
          python-version: "3.13"
      - run: |
          "${{ steps.blender_python.outputs.python-path }}" -m venv "$RUNNER_TEMP/blender"
          "$RUNNER_TEMP/blender/bin/pip" install -q bpy numpy pillow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2-dev
      - run: python -m pip install -q -e '.[production,video]'
      - run: PYTHONPATH=src python world3d/smoke_test.py --blender-python "$RUNNER_TEMP/blender/bin/python" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: world3d-check
          path: out/video.mp4
          retention-days: 3
