name: Clean flagship production

on:
  push:
    branches: ["codex/final"]
    paths:
      - ".github/flagship-clean-production-kick"
  workflow_dispatch:

concurrency:
  group: golide-clean-flagship
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_PRODUCTION_ID: golide-long-flagship-2026-09-03
  SCENE_CACHE_KEY: golide-production-correction-flagship-2026-09-03-33805778023-scene-fixed
  CHANNEL_ID: UCqaXVBSBz7iQsRHOupKt-3w

jobs:
  preflight:
    name: Full pipeline preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deterministic runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e '.[production]'

      - name: Run complete unit and regression suite
        run: |
          set -euo pipefail
          python -m compileall -q src tests
          python -m unittest discover -s tests -v

      - name: Restore and audit canonical flagship cache
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: ${{ env.SCENE_CACHE_KEY }}
          fail-on-cache-miss: true
          lookup-only: false

      - name: Validate every production prerequisite without paid APIs
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          from golide_engine.manifest import load_project, validate_assets
          from golide_engine.visual_identity import VisualIdentity
          from golide_engine.release.package import ReleasePackager

          source = Path('productions') / os.environ['SOURCE_PRODUCTION_ID']
          build = Path('build') / os.environ['SOURCE_PRODUCTION_ID']
          package = Path('release-packages') / os.environ['SOURCE_PRODUCTION_ID']
          manifest_path = source / 'render-manifest.json'
          storyboard_path = source / 'storyboard-authoritative-v5.json'
          metadata_path = source / 'upload-metadata.json'
          package_manifest = package / 'package-manifest.json'
          required = [manifest_path, storyboard_path, source/'script.txt', metadata_path, package_manifest]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('MISSING_REQUIRED_INPUTS=' + ';'.join(missing))

          manifest = json.loads(manifest_path.read_text())
          scenes = manifest.get('scenes', [])
          if len(scenes) != 108:
              raise SystemExit(f'EXPECTED_SCENES=108 GOT={len(scenes)}')
          expected = sum(float(x['duration']) for x in scenes)
          if not 280 <= expected <= 290:
              raise SystemExit(f'BAD_EDITORIAL_DURATION={expected:.3f}')

          errors = validate_assets(load_project(manifest_path))
          if errors:
              raise SystemExit('MANIFEST_ASSETS_INVALID=' + ';'.join(errors[:20]))

          scene_dir = build / 'scenes'
          valid = 0
          for i, scene in enumerate(scenes):
              clip = scene_dir / f'{i:03d}.mp4'
              if not clip.is_file() or clip.stat().st_size == 0:
                  continue
              p = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(clip)],capture_output=True,text=True)
              if p.returncode == 0:
                  try:
                      if abs(float(p.stdout.strip()) - float(scene['duration'])) <= 0.20:
                          valid += 1
                  except ValueError:
                      pass
          if valid != 108:
              raise SystemExit(f'CACHED_SCENE_CLIPS_INVALID={valid}/108')

          # Canonical identity must be decodable before any production work begins.
          identity = VisualIdentity('config/visual-identity.json')
          canonical = identity.canonical_avatar_reference()
          print('CANONICAL_AVATAR_SHA256=' + hashlib.sha256(canonical.read_bytes()).hexdigest())

          pkg = json.loads(package_manifest.read_text())
          if pkg.get('production_id') != os.environ['SOURCE_PRODUCTION_ID']:
              raise SystemExit('SOURCE_PACKAGE_ID_MISMATCH')
          source_release = pkg.get('release', {})
          if source_release.get('channel_id') != os.environ['CHANNEL_ID']:
              raise SystemExit('SOURCE_CHANNEL_MISMATCH')
          source_failures = ReleasePackager.verify(package)
          if source_failures:
              raise SystemExit('SOURCE_PACKAGE_INVALID=' + ';'.join(source_failures))

          # No accidental replacement behavior is permitted in this clean pipeline.
          if source_release.get('force_reupload') is True:
              print('SOURCE_FORCE_REUPLOAD_PRESENT=ignored-for-new-production')
          print(f'PREFLIGHT_PASS|scenes=108|duration={expected:.3f}|cache=validated')

  assemble:
    name: Build fresh flagship product
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      production_id: ${{ steps.ids.outputs.production_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e '.[production]'

      - name: Restore validated flagship media
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: ${{ env.SCENE_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Create immutable NEW production workspace
        id: ids
        shell: bash
        run: |
          set -euo pipefail
          NEW_ID="golide-long-flagship-${GITHUB_RUN_ID}"
          echo "production_id=${NEW_ID}" >> "$GITHUB_OUTPUT"
          export NEW_ID
          cp -a "productions/${SOURCE_PRODUCTION_ID}" "productions/${NEW_ID}"
          cp -a "build/${SOURCE_PRODUCTION_ID}" "build/${NEW_ID}"
          rm -f "build/${NEW_ID}/silent.mp4" "build/${NEW_ID}/video.mp4" "build/${NEW_ID}/metadata.json"
          rm -f "productions/${NEW_ID}/thumbnail-correction.jpg" "productions/${NEW_ID}/thumbnail-correction-source.png"
          python - <<'PY'
          import json, os
          from pathlib import Path
          pid=os.environ['NEW_ID']
          p=Path('productions')/pid/'render-manifest.json'
          data=json.loads(p.read_text())
          data['id']=pid
          data['publish']={'approved': True}
          p.write_text(json.dumps(data,indent=2)+'\n')
          # Make the new workspace explicitly a new product, while retaining the
          # already-assembled visual/audio ingredients from the validated source.
          (Path('productions')/pid/'product-origin.json').write_text(json.dumps({
              'type':'fresh-product-from-validated-assembled-components',
              'source_production_id':os.environ['SOURCE_PRODUCTION_ID'],
              'source_scene_cache_key':os.environ['SCENE_CACHE_KEY'],
              'youtube_replacement':False,
          },indent=2)+'\n')
          PY

      - name: Verify cached clips will be reused, not regenerated
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          pid=os.environ['NEW_ID'] if 'NEW_ID' in os.environ else f"golide-long-flagship-{os.environ['GITHUB_RUN_ID']}"
          manifest=json.loads((Path('productions')/pid/'render-manifest.json').read_text())
          scene_dir=Path('build')/pid/'scenes'
          count=0
          for i,scene in enumerate(manifest['scenes']):
              clip=scene_dir/f'{i:03d}.mp4'
              if not clip.is_file():
                  continue
              p=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(clip)],capture_output=True,text=True)
              if p.returncode==0:
                  try:
                      if abs(float(p.stdout.strip())-float(scene['duration']))<=0.20: count+=1
                  except ValueError: pass
          if count != 108: raise SystemExit(f'REUSE_PRECHECK_FAILED={count}/108')
          print('REUSE_PRECHECK=108/108')
          PY
        env:
          NEW_ID: ${{ steps.ids.outputs.production_id }}

      - name: Render NEW product using validated assembled components
        env:
          NEW_ID: ${{ steps.ids.outputs.production_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from golide_engine.manifest import load_project
          from golide_engine.render import render
          pid=os.environ['NEW_ID']
          path=Path('productions')/pid/'render-manifest.json'
          output=render(load_project(path),Path('.').resolve())
          print('FRESH_PRODUCT_VIDEO=' + str(output))
          PY

      - name: Validate final duration, cadence, streams and audio loudness
        env:
          NEW_ID: ${{ steps.ids.outputs.production_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from golide_engine.quality.audio import measure_loudness
          from golide_engine.quality.visual import probe_video
          pid=os.environ['NEW_ID']; work=Path('productions')/pid; build=Path('build')/pid
          manifest=json.loads((work/'render-manifest.json').read_text())
          expected=sum(float(x['duration']) for x in manifest['scenes'])
          def dur(p):
              r=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)],capture_output=True,text=True,check=True); return float(r.stdout.strip())
          silent=dur(build/'silent.mp4'); final=dur(build/'video.mp4')
          if abs(silent-expected)>0.35 or abs(final-expected)>0.35: raise SystemExit(f'DURATION_GATE_FAILED silent={silent:.3f} final={final:.3f} expected={expected:.3f}')
          sig=[]
          for second in [20,45,75,105,135,165,195,225,255,280]:
              r=subprocess.run(['ffmpeg','-v','error','-ss',str(second),'-i',str(build/'video.mp4'),'-frames:v','1','-vf','scale=48:27,format=gray','-f','rawvideo','-'],capture_output=True,check=True)
              sig.append(hashlib.sha256(r.stdout).hexdigest()[:16])
          unique=len(set(sig)); tail=len(set(sig[-5:]))
          if unique<7 or tail<4: raise SystemExit(f'CADENCE_GATE_FAILED unique={unique} tail={tail}')
          data=probe_video(build/'video.mp4'); stream=next(x for x in data['streams'] if x.get('codec_type')=='video'); audio=next(x for x in data['streams'] if x.get('codec_type')=='audio')
          if [int(stream['width']),int(stream['height'])] != [1920,1080]: raise SystemExit('DIMENSIONS_GATE_FAILED')
          loud=measure_loudness(build/'video.mp4')
          print(f'VIDEO_GATE_PASS duration={final:.3f} unique={unique} tail={tail} loudness={loud}')
          PY

      - name: Checkpoint assembled video immediately
        uses: actions/upload-artifact@v4
        with:
          name: flagship-assembled-${{ steps.ids.outputs.production_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/${{ steps.ids.outputs.production_id }}/video.mp4
            build/${{ steps.ids.outputs.production_id }}/silent.mp4
            productions/${{ steps.ids.outputs.production_id }}/render-manifest.json
            productions/${{ steps.ids.outputs.production_id }}/storyboard-authoritative-v5.json
            productions/${{ steps.ids.outputs.production_id }}/script.txt
            productions/${{ steps.ids.outputs.production_id }}/upload-metadata.json
            productions/${{ steps.ids.outputs.production_id }}/spoken-captions-authoritative-v3.srt
            productions/${{ steps.ids.outputs.production_id }}/editorial-beats-authoritative-v3.json
            productions/${{ steps.ids.outputs.production_id }}/source-ledger.json
            productions/${{ steps.ids.outputs.production_id }}/generation-parameters.json
            build/${{ steps.ids.outputs.production_id }}/visual-labels.srt

  qa_and_package:
    name: Fresh thumbnail + QA + package
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      production_id: ${{ steps.ids.outputs.production_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -e '.[production]'
      - name: Set production id
        id: ids
        run: echo "production_id=golide-long-flagship-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Download assembled checkpoint
        uses: actions/download-artifact@v4
        with:
          name: flagship-assembled-${{ steps.ids.outputs.production_id }}
          path: .
      - name: Build brand-new local wordless thumbnail from clean silent frame
        env:
          NEW_ID: ${{ steps.ids.outputs.production_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw
          import subprocess,os
          pid=os.environ['NEW_ID']; work=Path('productions')/pid; build=Path('build')/pid
          old=work/'thumbnail-correction.jpg'; old.unlink(missing_ok=True)
          frame=work/'thumbnail-source.jpg'
          subprocess.run(['ffmpeg','-y','-ss','12','-i',str(build/'silent.mp4'),'-frames:v','1','-q:v','2',str(frame)],check=True,capture_output=True)
          img=ImageOps.fit(Image.open(frame).convert('RGB'),(1280,720),method=Image.Resampling.LANCZOS)
          # New wordless treatment: no copied thumbnail, no API, no text, no avatar dependency.
          canvas=Image.new('RGB',(1280,720),(12,24,52)); canvas.paste(img,(18,18,1262,702))
          draw=ImageDraw.Draw(canvas)
          draw.rectangle((10,10,1270,710),outline=(212,167,73),width=10)
          draw.rectangle((28,28,1252,692),outline=(30,157,255),width=4)
          canvas.save(old,format='JPEG',quality=91,optimize=True,progressive=False)
          print(f'FRESH_WORDLESS_THUMBNAIL={old}')
          PY
      - name: Run full automatic QA
        env:
          NEW_ID: ${{ steps.ids.outputs.production_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          from golide_engine.quality.runner import QualityRunner
          pid=os.environ['NEW_ID']; work=Path('productions')/pid; build=Path('build')/pid
          storyboard=json.loads((work/'storyboard-authoritative-v5.json').read_text())
          meta=json.loads((work/'upload-metadata.json').read_text())
          script=(work/'script.txt').read_text().strip()
          report=QualityRunner('config/qa-policy.json').run(build/'video.mp4','long',storyboard,[script,meta['title'],meta['description']],work/'qa-report.json',work/'thumbnail-correction.jpg')
          if not report.passed: raise SystemExit('QA_FAILED='+'; '.join(report.failures))
          print('FULL_QA=passed')
          PY
      - name: Build a NEW release package, never touch old product
        env:
          NEW_ID: ${{ steps.ids.outputs.production_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from golide_engine.release.package import ReleasePackager
          pid=os.environ['NEW_ID']; work=Path('productions')/pid; build=Path('build')/pid
          source_pkg=Path('release-packages')/os.environ['SOURCE_PRODUCTION_ID']
          src_manifest=json.loads((source_pkg/'package-manifest.json').read_text())
          def src(role): return source_pkg/src_manifest['files'][role]['file']
          inputs=work/'package-inputs'; inputs.mkdir(exist_ok=True)
          shutil.copy2(work/'upload-metadata.json',inputs/'upload-metadata.json')
          shutil.copy2(work/'spoken-captions-authoritative-v3.srt',inputs/'spoken-captions.srt')
          shutil.copy2(build/'visual-labels.srt',inputs/'visual-captions.srt')
          shutil.copy2(src('source_ledger'),inputs/'source-ledger.json')
          shutil.copy2(src('generation_parameters'),inputs/'generation-parameters.json')
          release={'approved':True,'channel_id':os.environ['CHANNEL_ID'],'scheduled_at':None,'qa':{'passed':True}}
          files={
            'video':build/'video.mp4', 'thumbnail':work/'thumbnail-correction.jpg',
            'metadata':inputs/'upload-metadata.json', 'spoken_captions':inputs/'spoken-captions.srt',
            'visual_captions':inputs/'visual-captions.srt', 'source_ledger':inputs/'source-ledger.json',
            'generation_parameters':inputs/'generation-parameters.json', 'qa_report':work/'qa-report.json'
          }
          out=ReleasePackager('release-packages').build(pid,files,release,{'mode':'fresh-product-from-validated-assembled-components','source_production_id':os.environ['SOURCE_PRODUCTION_ID']})
          print('NEW_RELEASE_PACKAGE='+str(out))
          PY
          golide release-verify "release-packages/${NEW_ID}"
      - name: Checkpoint NEW release package
        uses: actions/upload-artifact@v4
        with:
          name: flagship-release-${{ steps.ids.outputs.production_id }}
          if-no-files-found: error
          retention-days: 7
          path: release-packages/${{ steps.ids.outputs.production_id }}

  private_upload:
    name: Upload NEW flagship privately
    needs: qa_and_package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install upload runtime
        run: python -m pip install -e '.[production]'
      - name: Set production id
        id: ids
        run: echo "production_id=golide-long-flagship-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Download NEW release package checkpoint
        uses: actions/download-artifact@v4
        with:
          name: flagship-release-${{ steps.ids.outputs.production_id }}
          path: release-packages/${{ steps.ids.outputs.production_id }}
      - name: Re-verify NEW package before network write
        run: |
          set -euo pipefail
          golide release-verify "release-packages/${{ steps.ids.outputs.production_id }}"
          python - <<'PY'
          import json,os
          from pathlib import Path
          pid=os.environ['GITHUB_RUN_ID']; p=Path('release-packages')/f'golide-long-flagship-{pid}'/'package-manifest.json'
          m=json.loads(p.read_text()); r=m['release']
          if m['production_id'] != f'golide-long-flagship-{pid}': raise SystemExit('PACKAGE_ID_GUARD_FAILED')
          if r.get('channel_id') != os.environ['CHANNEL_ID']: raise SystemExit('CHANNEL_GUARD_FAILED')
          if r.get('force_reupload') is True: raise SystemExit('REPLACEMENT_FLAG_MUST_BE_FALSE_FOR_NEW_PRODUCT')
          print('UPLOAD_GUARDS=passed')
          PY
      - name: Decode stored YouTube OAuth token
        env:
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
        run: |
          set -euo pipefail
          test -n "$YOUTUBE_OAUTH_TOKEN_B64"
          mkdir -p .secrets
          printf '%s' "$YOUTUBE_OAUTH_TOKEN_B64" | base64 --decode > .secrets/youtube-token.json
      - name: Upload NEW video privately
        env:
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
        run: |
          set -euo pipefail
          golide youtube-upload "release-packages/golide-long-flagship-${GITHUB_RUN_ID}" --token .secrets/youtube-token.json
      - name: Save upload result
        uses: actions/upload-artifact@v4
        with:
          name: flagship-upload-result-${{ steps.ids.outputs.production_id }}
          retention-days: 30
          path: data/golide.sqlite3
