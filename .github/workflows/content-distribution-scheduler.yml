name: Content distribution scheduler

on:
  schedule:
    # 08:30 and 17:30 Africa/Lusaka (UTC+2). These are the two locked
    # daily static-post windows; do not poll every 15 minutes.
    - cron: "30 6 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

concurrency:
  group: golide-content-distribution
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOLIDE_ENABLE_PAID_PRODUCTION: "1"
      GOLIDE_STATIC_OPENAI_MONTHLY_CAP_USD: "3.00"
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      GOLIDE_STUDIO_BYPASS_TOKEN: ${{ secrets.GOLIDE_STUDIO_BYPASS_TOKEN }}
      GOLIDE_PRODUCT_REGISTRY_URL: "https://marketplace.golidee.com/api/product-registry"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The Studio master Start/Pause control is the single runtime gate.
      # Publishing is allowed whenever that owner-controlled gate is running.
      GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"

    steps:
      - name: Check Studio automation control
        id: automation
        shell: bash
        run: |
          set -u
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=golide-studio-engine" || true)"
          TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          if [ -z "$TOKEN" ]; then
            echo "::warning::GitHub OIDC token unavailable; Studio automation gate failing closed."
            exit 0
          fi
          # OpenAI Sites gate pass: only needed while Studio is hosted on OpenAI Sites.
          # On Cloudflare the GitHub OIDC token alone is accepted.
          SITES_HEADER=()
          if [ -n "${GOLIDE_STUDIO_BYPASS_TOKEN:-}" ]; then
            SITES_HEADER=(-H "OAI-Sites-Authorization: Bearer $GOLIDE_STUDIO_BYPASS_TOKEN")
          fi
          HTTP_CODE="$(curl --silent --show-error -o gate.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "${SITES_HEADER[@]}" \
            "https://studio.golidee.com/api/engine/automation/status" || echo 000)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Studio automation gate returned HTTP $HTTP_CODE; failing closed."
            head -c 300 gate.json 2>/dev/null || true
            exit 0
          fi
          ENABLED="$(jq -r '.enabled // false' gate.json)"
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Studio automation is RUNNING."
          else
            echo "::notice::Studio automation is PAUSED (Start automation not switched on); no paid work will run."
          fi
      - uses: actions/checkout@v4
        if: steps.automation.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.automation.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
        if: steps.automation.outputs.enabled == 'true'
      - name: Create due static content
        if: steps.automation.outputs.enabled == 'true'
        run: golide static-automation-run
      - name: Publish due static content
        if: steps.automation.outputs.enabled == 'true'
        run: golide studio-social-publish
      - name: Remind owner before LinkedIn access expires
        if: steps.automation.outputs.enabled == 'true' && always()
        continue-on-error: true
        env:
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
        run: golide connection-reminders
