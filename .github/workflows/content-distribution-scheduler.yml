name: Content distribution scheduler

on:
  schedule:
    # 08:30 and 17:30 Africa/Lusaka (UTC+2). These are the two locked
    # daily static-post windows; do not poll every 15 minutes.
    - cron: "30 6 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:

concurrency:
  group: golide-content-distribution
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOLIDE_ENABLE_PAID_PRODUCTION: "1"
      GOLIDE_STATIC_OPENAI_MONTHLY_CAP_USD: "3.00"
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      GOLIDE_STUDIO_BYPASS_TOKEN: ${{ secrets.GOLIDE_STUDIO_BYPASS_TOKEN }}
      GOLIDE_PRODUCT_REGISTRY_URL: "https://marketplace.golidee.com/api/product-registry"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GOLIDE_META_API_VERSION: ${{ secrets.GOLIDE_META_API_VERSION }}
      INSTAGRAM_USER_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_USER_ACCESS_TOKEN }}
      GOLIDE_INSTAGRAM_USER_ID: ${{ secrets.GOLIDE_INSTAGRAM_USER_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      GOLIDE_FACEBOOK_PAGE_ID: ${{ secrets.GOLIDE_FACEBOOK_PAGE_ID }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      GOLIDE_LINKEDIN_AUTHOR_URN: ${{ secrets.GOLIDE_LINKEDIN_AUTHOR_URN }}
      GOLIDE_LINKEDIN_VERSION: ${{ secrets.GOLIDE_LINKEDIN_VERSION }}
      X_USER_ACCESS_TOKEN: ${{ secrets.X_USER_ACCESS_TOKEN }}
      YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
      # The Studio master Start/Pause control is the single runtime gate.
      # Publishing is allowed whenever that owner-controlled gate is running.
      GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"

    steps:
      - name: Check Studio automation control
        id: automation
        shell: bash
        run: |
          set -u
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=golide-studio-engine" || true)"
          TOKEN="$(printf '%s' "$OIDC_JSON" | jq -r '.value // empty')"
          if [ -z "$TOKEN" ]; then
            echo "Studio automation gate unavailable; failing closed."
            exit 0
          fi
          if [ -z "${GOLIDE_STUDIO_BYPASS_TOKEN:-}" ]; then
            echo "Studio Sites bypass token is missing; failing closed."
            exit 0
          fi
          STATE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "OAI-Sites-Authorization: Bearer $GOLIDE_STUDIO_BYPASS_TOKEN" \
            "https://studio.golidee.com/api/engine/automation/status" || true)"
          ENABLED="$(printf '%s' "$STATE" | jq -r '.enabled // false')"
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Studio automation is RUNNING."
          else
            echo "Studio automation is PAUSED; no paid work will run."
          fi
      - uses: actions/checkout@v4
        if: steps.automation.outputs.enabled == 'true' || github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
      - uses: actions/setup-python@v5
        if: steps.automation.outputs.enabled == 'true' || github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
        if: steps.automation.outputs.enabled == 'true' || github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch'
      - name: Create due static content
        if: steps.automation.outputs.enabled == 'true'
        run: golide static-automation-run
      - name: Publish due static content
        if: steps.automation.outputs.enabled == 'true'
        run: golide studio-social-publish
