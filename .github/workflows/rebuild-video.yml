name: Rebuild a finished video

# Re-renders a finished job with the current renderer from its saved
# checkpoints (same script, recording, timings, metadata, thumbnail), then,
# after the owner approves the emailed preview, publishes it to YouTube as a
# new video and to Instagram and Facebook as Reels.
on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "Job id, e.g. golide-short-2026-10-05"
        required: true
      step:
        description: "preview (build + email link) or publish (after approval)"
        required: true
        type: choice
        options: [preview, publish]
      scene_plan:
        description: "Optional replacement scene plan (same words), path in the repo"
        required: false
        default: ""
      new_art:
        description: "Re-plan scenes and draw new illustrations"
        required: false
        type: boolean
        default: false

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved production checkpoints
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg, fonts and Cairo
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -exec mv {} {}.disabled \;
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2-dev pkg-config
      - run: python -m pip install -e '.[production,video]'
      - name: Rebuild (${{ inputs.step }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"
          GOLIDE_OPENAI_MONTHLY_CAP_USD: "7.00"
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODUCTION_ID: ${{ inputs.production_id }}
          STEP: ${{ inputs.step }}
          SCENE_PLAN: ${{ inputs.scene_plan }}
          NEW_ART: ${{ inputs.new_art }}
          # Previews are private to the owner, so they may render during a
          # style hold; publishing never re-renders.
          GOLIDE_RENDER_HOLD_BYPASS: ${{ inputs.step == 'preview' && '1' || '0' }}
        run: |
          set -o pipefail
          args=(rebuild-video --id "$PRODUCTION_ID" --step "$STEP")
          if [ -n "$SCENE_PLAN" ]; then args+=(--scene-plan "$SCENE_PLAN"); fi
          if [ "$NEW_ART" = "true" ]; then args+=(--new-art); fi
          if ! golide "${args[@]}" 2>&1 | tee engine-output.txt; then
            tail -c 1500 engine-output.txt | tr '\n' ' ' | sed 's/%/%25/g' > engine-error.txt
            echo "::error title=golide rebuild-video failed::$(cat engine-error.txt)"
            exit 1
          fi
          grep -o '"status": "[a-z_]*"' engine-output.txt | tail -1 | sed 's/^/::notice title=rebuild::/'
      - name: Save checkpoints
        id: checkpoint_save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove superseded checkpoints
        if: always() && steps.checkpoint_save.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key] | @tsv' | \
          while IFS=$'\t' read -r id key; do
            case "$key" in
              golide-production-checkpoint-*)
                if [ "$key" != "$CURRENT_CACHE_KEY" ]; then
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
                fi
                ;;
            esac
          done
      - name: Save state
        if: always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data production-queue
          git diff --cached --quiet || git commit -m "ops: rebuild ${{ inputs.production_id }} (${{ inputs.step }})"
          git pull --rebase --autostash
          git push
