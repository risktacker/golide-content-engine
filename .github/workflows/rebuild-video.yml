name: Rebuild a finished video

# Re-renders a finished job with the current renderer from its saved
# checkpoints (same script, recording, timings, metadata, thumbnail), then,
# after the owner approves the emailed preview, publishes it to YouTube as a
# new video and to Instagram and Facebook as Reels.
on:
  workflow_dispatch:
    inputs:
      production_id:
        description: "Job id, e.g. golide-short-2026-10-05"
        required: true
      step:
        description: "preview (build + email link) or publish (after approval)"
        required: true
        type: choice
        options: [preview, publish]
      scene_plan:
        description: "Optional replacement scene plan (same words), path in the repo"
        required: false
        default: ""
      new_art:
        description: "Re-plan scenes and draw new illustrations"
        required: false
        type: boolean
        default: false
      title:
        description: "Optional new YouTube title"
        required: false
        default: ""
      live_studio:
        description: "TRIAL: the living studio (3D room, live Goli) for this re-cut"
        required: false
        type: boolean
        default: false

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      HF_DE_STALL_MS: "900000"   # 2026-11-26: a living-studio frame can take over a minute to draw
    steps:
      - uses: actions/checkout@v4
      - name: Restore saved production checkpoints
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg, fonts and Cairo
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -exec mv {} {}.disabled \;
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libcairo2-dev pkg-config libegl1 libgl1
      - run: python -m pip install -e '.[production,video]'
      # 2026-11-25: an edit-engine video is re-cut here too (HyperFrames + the browser), as in production-scheduler.yml
      - name: Keep the browser between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-v1
      - name: Browser
        run: |
          python -m playwright install chromium
          if ! python -c "from playwright.sync_api import sync_playwright as p; x = p().start(); x.chromium.launch().close(); x.stop()" >/dev/null 2>&1; then
            timeout 600 python -m playwright install-deps chromium
          fi
      - name: Keep the edit engine tools between runs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/golide-rhubarb
            ~/.npm
          key: edit-tools-v2-hyperframes-0.9.32-rhubarb-1.14.0
      - name: Edit engine tools (Rhubarb Lip Sync, HyperFrames)
        run: |
          R="$HOME/.cache/golide-rhubarb"
          if [ ! -x "$R/Rhubarb-Lip-Sync-1.14.0-Linux/rhubarb" ]; then
            mkdir -p "$R" && curl -sSL -o "$R/r.zip" https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.14.0/Rhubarb-Lip-Sync-1.14.0-Linux.zip \
              && unzip -qo "$R/r.zip" -d "$R" && rm "$R/r.zip" || echo "::warning title=Rhubarb::download failed, mouth follows loudness"
          fi
          npx -y hyperframes@0.9.32 --version || true
      - name: Rebuild (${{ inputs.step }})
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # starts the 3D Short render machines (shorts3d-render.yml)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_ENABLE_SOCIAL_PUBLISH: "1"
          GOLIDE_SMTP_USER: ${{ secrets.GOLIDE_SMTP_USER }}
          GOLIDE_SMTP_APP_PASSWORD: ${{ secrets.GOLIDE_SMTP_APP_PASSWORD }}
          GOLIDE_NOTIFY_EMAIL: ${{ secrets.GOLIDE_NOTIFY_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRODUCTION_ID: ${{ inputs.production_id }}
          STEP: ${{ inputs.step }}
          SCENE_PLAN: ${{ inputs.scene_plan }}
          NEW_ART: ${{ inputs.new_art }}
          NEW_TITLE: ${{ inputs.title }}
          GOLIDE_LIVE_STUDIO: ${{ inputs.live_studio && '1' || '0' }}
          # Previews are private to the owner, so they may render during a
          # style hold; publishing never re-renders.
          GOLIDE_RENDER_HOLD_BYPASS: ${{ inputs.step == 'preview' && '1' || '0' }}
        run: |
          set -o pipefail
          args=(rebuild-video --id "$PRODUCTION_ID" --step "$STEP")
          if [ -n "$SCENE_PLAN" ]; then args+=(--scene-plan "$SCENE_PLAN"); fi
          if [ "$NEW_ART" = "true" ]; then args+=(--new-art); fi
          if [ -n "$NEW_TITLE" ] && [ "$STEP" = "preview" ]; then args+=(--title "$NEW_TITLE"); fi
          if ! golide "${args[@]}" 2>&1 | tee engine-output.txt; then
            tail -c 1500 engine-output.txt | tr '\n' ' ' | sed 's/%/%25/g' > engine-error.txt
            echo "::error title=golide rebuild-video failed::$(cat engine-error.txt)"
            exit 1
          fi
          grep -o '"status": "[a-z_]*"' engine-output.txt | tail -1 | sed 's/^/::notice title=rebuild::/'
      - name: Save checkpoints
        id: checkpoint_save
        # 2026-11-27: a run cancelled before its checkpoints were restored saved nothing (a warning, not a failure), and the
        # step after it then deleted every older checkpoint: nothing is saved or pruned without the productions folder
        if: always() && hashFiles('productions/**/spec*.json', 'productions/**/*.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove superseded checkpoints
        if: always() && steps.checkpoint_save.outcome == 'success' && hashFiles('productions/**/*.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_CACHE_KEY: golide-production-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id,.key] | @tsv' | \
          while IFS=$'\t' read -r id key; do
            case "$key" in
              golide-production-checkpoint-*)
                if [ "$key" != "$CURRENT_CACHE_KEY" ]; then
                  gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}"
                fi
                ;;
            esac
          done
      - name: Save state
        if: always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data production-queue
          git diff --cached --quiet || git commit -m "ops: rebuild ${{ inputs.production_id }} (${{ inputs.step }})"
          git pull --rebase --autostash
          # Another push may have landed meanwhile: rebase onto it and retry.
          for attempt in 1 2 3 4 5; do
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
          done
