name: YouTube Connection Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/youtube-connection-test.yml"
      - "src/golide_engine/youtube/auth.py"
      - "src/golide_engine/cli.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
      - name: Verify YouTube OAuth token and exact channel
        run: golide youtube-verify
