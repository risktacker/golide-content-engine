name: Verify owner-recording voice policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/providers.json"
      - "config/video-profile.json"
      - "src/golide_engine/providers/registry.py"
      - "src/golide_engine/orchestration/production.py"
      - ".github/workflows/voice-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Verify owner-recording-only narration policy
        run: golide voice-verify
