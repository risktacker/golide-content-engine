name: Goli 3D library (render the reaction folders)

# 2026-11-21 (owner): Goli in real 3D replaces the flat SVG everywhere. His renders live in folders
# (assets/goli3d/full/<pose>/<expression>.png), drawn once with Blender and reused. One job per pose in parallel,
# then one commit with every new file. Files already in the folders are kept.
on:
  workflow_dispatch:
    inputs:
      poses: {description: "Poses to draw, space-separated (empty = all)", default: ""}
      kind: {description: "library (thumbnail cut-outs) or video (talking sprites)", default: "library"}
      from_run: {description: "Only collect the renders of this finished run id (no new renders)", default: ""}

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      poses: ${{ steps.p.outputs.poses }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ -n "${{ inputs.poses }}" ]; then P="${{ inputs.poses }}"; else
            if [ "${{ inputs.kind }}" = "video" ]; then
              P=$(python3 -c "import re;s=open('tools/goli3d_video.py').read();print(' '.join(re.findall(r'\"(\w+)\": \"', s[s.index('FACE = {'):s.index('}', s.index('FACE = {'))])))")
            else
              P=$(python3 -c "import re;s=open('tools/goli3d_library.py').read();print(' '.join(re.findall(r'\"(\w+)\": ', s[s.index('PLAN = {'):])))"); fi; fi
          echo "poses=$(python3 -c "import json,sys;print(json.dumps(sys.argv[1:]))" $P)" >> "$GITHUB_OUTPUT"
  render:
    needs: plan
    if: inputs.from_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        pose: ${{ fromJson(needs.plan.outputs.poses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -q bpy==5.3.0 pillow
      - run: python tools/goli3d_${{ inputs.kind }}.py ${{ matrix.pose }}
      - uses: actions/upload-artifact@v4
        with:
          name: goli3d-${{ matrix.pose }}
          path: assets/goli3d/${{ inputs.kind == 'video' && 'video' || 'full' }}/${{ matrix.pose }}
  commit:
    needs: render
    if: always() && (needs.render.result == 'success' || inputs.from_run != '')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          # the branch may have moved while the renders ran: commit on its newest commit, no rebase needed
          git fetch -q --depth=1 origin ${{ github.ref_name }} && git checkout -q -B out FETCH_HEAD
          K=${{ inputs.kind == 'video' && 'video' || 'full' }}
          for d in dl/goli3d-*; do p=${d#dl/goli3d-}; mkdir -p assets/goli3d/$K/$p; cp $d/* assets/goli3d/$K/$p/; done
          git add assets/goli3d
          git -c user.name=golide-bot -c user.email=bot@golidee.com commit -qm "goli3d: render ${{ inputs.kind }}" || exit 0
          git push -q origin HEAD:${{ github.ref_name }}
