name: One-time corrected long-video publication

on:
  push:
    branches: ["main"]
    paths:
      - ".github/production-correction-kick"

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  correct-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore full paid-media checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-${{ github.run_id }}
          restore-keys: |
            golide-production-checkpoint-33609292568-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg and GOLIDE fonts
        run: |
          if command -v ffmpeg >/dev/null && fc-match DejaVuSans >/dev/null; then
            ffmpeg -version | head -1
            fc-match DejaVuSans | head -1
          else
            sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -iname '*microsoft*' -exec mv {} {}.disabled \;
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - run: python -m pip install -e '.[production]'
      - name: Rebuild corrected mux and replace upload
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_FORCE_REUPLOAD_PRODUCTION_ID: "golide-long-2026-09-01"
          GOLIDE_OBSOLETE_YOUTUBE_VIDEO_ID: "P7on5HfmI4Q"
          GOLIDE_OPENAI_MONTHLY_CAP_USD: "5.00"
          GOLIDE_STUDIO_BASE_URL: "https://golide-studio.esiahkapinga.chatgpt.site"
          GOLIDE_STUDIO_BYPASS_TOKEN: ${{ secrets.GOLIDE_STUDIO_BYPASS_TOKEN }}
        run: golide automation-run --queue production-correction-queue
      - name: Save corrected state
        if: always()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data production-correction-queue
          git diff --cached --quiet || git commit -m "ops: record corrected production"
          git push
