name: One-time corrected long-video publication

on:
  push:
    branches: ["main"]
    paths:
      - ".github/production-correction-kick"

concurrency:
  group: golide-state-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  publish-existing-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore approved corrected media
        uses: actions/cache/restore@v4
        with:
          path: |
            productions
            build
            release-packages
            generated
          key: golide-production-correction-upload-${{ github.run_id }}
          restore-keys: |
            golide-production-correction-
            golide-production-checkpoint-33609292568-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
      - name: Verify existing corrected release package
        run: |
          test -f release-packages/golide-long-2026-09-01/package-manifest.json
          golide release-verify release-packages/golide-long-2026-09-01
      - name: Upload existing corrected video as a new YouTube video
        env:
          YOUTUBE_OAUTH_TOKEN_B64: ${{ secrets.YOUTUBE_OAUTH_TOKEN_B64 }}
          GOLIDE_ENABLE_YOUTUBE_UPLOAD: "1"
          GOLIDE_FORCE_REUPLOAD_PRODUCTION_ID: "golide-long-2026-09-01"
        run: |
          golide youtube-upload release-packages/golide-long-2026-09-01
      - name: Save corrected state
        if: success()
        run: |
          git config user.name "golide-production-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ops: record corrected YouTube publication"
          git pull --rebase origin main
          git push
