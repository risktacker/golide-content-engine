# One-off (owner request 2026-10-21): fresh thumbnails for the published long videos.
# Remove this workflow, tools/thumbnail_refresh.py and the thumbnail-refresh-tmp
# branch after 72 hours (by 2026-10-24).
name: Thumbnail refresh (one-off)

on:
  workflow_dispatch:
    inputs:
      productions:
        description: "Production ids, space separated"
        required: true
        default: "golide-long-2026-10-06 golide-long-2026-10-10 golide-long-2026-10-13 golide-long-2026-10-17 golide-long-2026-10-20"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config fonts-dejavu-core
          python -m pip install -e '.[production,video]'

      - name: Make the thumbnails
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOLIDE_ENABLE_PAID_PRODUCTION: "1"
        run: python tools/thumbnail_refresh.py ${{ inputs.productions }}

      - name: Hand them over on a temporary branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/out && cp thumbnail-refresh/* /tmp/out/
          git config user.name "golide-engine"
          git config user.email "engine@golidee.com"
          git checkout --orphan thumbnail-refresh-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/* .
          git add -A
          git commit -m "Thumbnail refresh (temporary, delete by 2026-10-24)"
          git push -f origin thumbnail-refresh-tmp
