name: Take a video down (private)

# 2026-11-21 (owner): take a broken video off the channel at once. It goes PRIVATE (nothing is deleted, so it can be
# looked at or restored); its pending scheduled time is dropped.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  take_down:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[production]'
      - name: Make it private
        env:
          GOLIDE_STUDIO_BASE_URL: "https://studio.golidee.com"
          VID: ${{ inputs.video_id }}
        run: |
          python - <<'PY'
          import json, os
          from golide_engine.youtube.auth import services
          vid = os.environ["VID"]
          youtube, _ = services()
          youtube.videos().update(part="status", body={"id": vid, "status": {
              "privacyStatus": "private", "selfDeclaredMadeForKids": False}}).execute()
          item = youtube.videos().list(part="status,snippet", id=vid).execute()["items"][0]
          print(json.dumps({"status": "taken_down", "video_id": vid, "privacy": item["status"]["privacyStatus"],
                            "title": item["snippet"]["title"]}))
          if item["status"]["privacyStatus"] != "private":
              raise SystemExit("YouTube did not make it private")
          PY
